<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>test — Gavin Games</title>
  <meta name="description" content="Play test unblocked free in your browser at Gavin Games. testing">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="stylesheet" href="../styles.css">
</head>
<body>

<nav>
  <div class="nav-logo"><a href="../index.html">🎮 <span>Gavin</span>Games</a></div>
  <div class="nav-links">
    <a href="../index.html">Home</a>
    <a href="../updates.html">Updates</a>
  </div>
  <a href="../index.html" class="nav-games-btn">All games</a>
</nav>

<div class="game-header">
  <a href="../index.html" class="btn">← Back</a>
  <span class="game-title">🗿 test <span class="badge badge-hot">popular</span></span>
  <div class="game-actions">
    <button class="btn" onclick="openBlank()">Open in new tab</button>
    <button class="btn btn-primary" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  </div>
</div>

<div class="embed-wrap" id="embedWrap">
  <iframe src="gavingames.net" allowfullscreen title="test game"></iframe>
</div>
<button class="fullscreen-exit" onclick="toggleFullscreen()">✕ Exit fullscreen</button>

<div class="game-tags">
  <span class="game-tag">Platformer</span>
  <span class="game-tag">Single player</span>
  <span class="game-tag">🖱 test maxxing</span>
</div>

<div style="padding: 0 24px 8px; max-width: 560px;">
  <p style="font-size:14px; color:var(--muted); line-height:1.7;">a test</p>
</div>

<footer>
  © Gavin Games · <a href="../index.html" style="color:var(--accent)">← All games</a>
</footer>

<script>
function toggleFullscreen() { document.getElementById('embedWrap').classList.toggle('fullscreen'); }
function openBlank() {
  const w = window.open("about:blank");
  if (w) { w.document.write(`<!DOCTYPE html><html><head><title>test - Gavin Games</title></head><body style="margin:0;height:100vh;overflow:hidden;background:#000"><iframe src="gavingames.net" style="border:none;width:100%;height:100%" allowfullscreen></iframe></body></html>`); w.document.close(); }
  else { alert("Popup blocked!"); }
}
document.addEventListener('keydown', e => { if (e.key==='Escape') document.getElementById('embedWrap').classList.remove('fullscreen'); });
</script>
</body>
</html>
