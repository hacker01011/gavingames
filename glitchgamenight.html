<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Glitch Game Night</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lilita+One&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-sized column shared by a hub, two pass-and-play games and an account area. Lizard = leaf green, Tsunami = sea blue. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14212b; --muted:#566673; --line:#d2dce3;
  --accent:#ff7a1a; --accent-ink:#1a0d00;
  --leaf:#2f8a3e; --leaf-ink:#ffffff; --sea:#0e7fa6; --sea-ink:#ffffff;
  --foam:#bfe9f5; --b4:#0b6e8f; --b3:#3aa5c7; --b2:#9ad6e8;
  --gold:#b7791f; --ok:#15803d; --bad:#c2410c; --rare-bg:#fff1e6;
  --display:"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --meme:"Anton", Impact, "Arial Narrow Bold", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1218; --surface:#141f28; --ink:#e6eef3; --muted:#93a6b3; --line:#26343f;
  --accent:#ff9447; --accent-ink:#1a0d00;
  --leaf:#5cc96b; --leaf-ink:#0b170c; --sea:#38b6dc; --sea-ink:#04131a;
  --foam:#123a4a; --b4:#5fd0f0; --b3:#2f97b8; --b2:#1d5f75;
  --gold:#f6c453; --ok:#4ade80; --bad:#fdba74; --rare-bg:#2a1608; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1218; --surface:#141f28; --ink:#e6eef3; --muted:#93a6b3; --line:#26343f;
  --accent:#ff9447; --accent-ink:#1a0d00;
  --leaf:#5cc96b; --leaf-ink:#0b170c; --sea:#38b6dc; --sea-ink:#04131a;
  --foam:#123a4a; --b4:#5fd0f0; --b3:#2f97b8; --b2:#1d5f75;
  --gold:#f6c453; --ok:#4ade80; --bad:#fdba74; --rare-bg:#2a1608; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.stage{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stage.lizard{--main:var(--leaf);--main-ink:var(--leaf-ink)}
.stage.tsunami{--main:var(--sea);--main-ink:var(--sea-ink)}
.stage{--main:var(--accent);--main-ink:var(--accent-ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:2.5rem}
h2{font-size:1.7rem}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.small-print{font-size:.88rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.center{text-align:center;align-items:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label{font-weight:600;font-size:.9rem}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
button{font:700 1rem var(--body);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--main);color:var(--main-ink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.small{padding:8px 12px;font-size:.9rem;border-radius:10px}
button.big{width:100%;font-size:1.15rem;padding:18px}
button.power{background:var(--rare-bg);color:var(--ink);border:2px solid var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.who{font:400 2.4rem var(--display)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;min-width:0}
.tabs button[aria-pressed="false"]{background:transparent;color:var(--ink);border:1px solid var(--line)}

/* hub */
.gamecard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:18px}
.gamecard .ic{font-size:2.6rem;line-height:1}
.gamecard b{font:400 1.5rem var(--display);display:block}
.gamecard span{font-weight:400;font-size:.9rem}
.gc-liz{background:var(--leaf);color:var(--leaf-ink)}
.gc-tsu{background:var(--sea);color:var(--sea-ink)}

/* avatars */
.av{--s:44px;position:relative;width:var(--s);height:var(--s);border-radius:50%;background:var(--avbg,#888);display:inline-grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.av .f{font-size:calc(var(--s)*.58);line-height:1}
.av .h{position:absolute;top:calc(var(--s)*-.30);left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.42);line-height:1}
.av .b{position:absolute;right:calc(var(--s)*-.12);top:calc(var(--s)*.02);font-size:calc(var(--s)*.32);line-height:1}
.av .o{position:absolute;bottom:calc(var(--s)*-.26);left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.44);line-height:1}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sitem{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 12px;border-radius:16px;color:#fff;text-align:center;
  background:linear-gradient(160deg,var(--rc),color-mix(in srgb,var(--rc) 45%,#000));border:2px solid transparent;min-width:0}
.sitem .e{font-size:2.6rem;line-height:1.1}
.sitem .chipc{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.sitem small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.sitem .price{background:rgba(0,0,0,.35);border-radius:999px;padding:2px 10px;font-weight:700}
.sitem.owned{opacity:.55}
.sitem[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--rc)}
.rewardrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rewardrow .lv{font:400 1.1rem var(--display);width:3.2em;flex:none}
.rewardrow.locked{opacity:.5}
.mini{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini .log{font-size:.88rem}
.av.lg{--s:96px}
.av.md{--s:60px}
.av.sm{--s:32px}
.player{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.player .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.acct-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:16px 8px 10px}
.acct-grid button small{font-weight:400;color:var(--muted)}

/* color login */
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{aspect-ratio:1/1;border-radius:14px;border:2px solid var(--line);padding:0;display:flex;align-items:flex-end;justify-content:center;font-size:.7rem;font-weight:700;padding-bottom:4px;max-width:100%}
.qbig{font:400 1.9rem var(--display);text-align:center}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--main)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}
.pad button{height:56px;font:400 1.5rem var(--display);padding:0}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--main)}

/* economy */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.stats b{display:block;font:400 1.5rem var(--display);font-variant-numeric:tabular-nums}
.gb{color:var(--gold);font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 4px;font-size:.78rem;font-weight:600;text-align:center}
.item .e{font-size:1.8rem;line-height:1.1}
.item .chipc{width:28px;height:28px;border-radius:50%}
.item[aria-pressed="true"]{border-color:var(--accent)}
.packs4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;color:#fff}
.pack b{font:400 1.2rem var(--display)}
.pack span{font-weight:400;font-size:.8rem;opacity:.9}
.pk-pirate{background:linear-gradient(140deg,#c0392b,#1f4e79)}
.pk-idol{background:linear-gradient(140deg,#d63384,#3b1d6e)}
.pk-cursed{background:linear-gradient(140deg,#3d1a6e,#0d0d14)}
.pk-glitch{background:linear-gradient(140deg,#118a4e,#0b2a3a)}
.toast{background:var(--rare-bg);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;font-weight:600}

/* lizard */
.public{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--leaf);color:var(--leaf-ink);border-radius:14px;padding:12px 16px}
.public b{font:400 1.4rem var(--display)}
.public .eyebrow{color:inherit;opacity:.85}
.word{font:400 3rem var(--display);line-height:1;word-break:break-word}
.role{min-height:300px;justify-content:center;align-items:center;text-align:center}
.role.liz{animation:shift 4s linear infinite;border-color:transparent;color:#0b170c}
.role.liz .eyebrow{color:#0b170c}
@keyframes shift{0%{background:#7bd88f}25%{background:#f6d365}50%{background:#fda085}75%{background:#a18cd1}100%{background:#7bd88f}}
.hintbox{background:rgba(255,255,255,.6);border-radius:10px;padding:8px 12px;color:#0b170c}
.order{display:flex;flex-wrap:wrap;gap:6px}
.order span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:600;font-size:.9rem}
.order span:first-child{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}

/* tsunami meter */
.ends{display:flex;justify-content:space-between;gap:12px;font:400 1.25rem var(--display)}
.ends span:last-child{text-align:right}
.meter{position:relative;height:64px;border-radius:14px;background:var(--foam);overflow:hidden;border:1px solid var(--line)}
.meter .water{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,transparent,var(--sea));opacity:.35;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.meter .zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,122,26,.35) 6px 12px)}
.band{position:absolute;top:0;bottom:0;transform:translateX(-50%)}
.band.b2{background:var(--b2)} .band.b3{background:var(--b3)} .band.b4{background:var(--b4)}
.band span{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font:700 .72rem var(--body);color:var(--sea-ink)}
.pin{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.pin b{position:absolute;top:2px;left:6px;font-size:.72rem;white-space:nowrap;background:var(--surface);color:var(--ink);padding:0 4px;border-radius:4px;border:1px solid var(--line)}
.pin.right b{left:auto;right:6px}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--sea);height:36px}
.readout{font:400 1.4rem var(--display);font-variant-numeric:tabular-nums;text-align:center}
.rare{background:var(--rare-bg);border:2px solid var(--bad);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;animation:pop .5s ease-out}
.rare .eyebrow{color:var(--bad)}
.rare b{font:400 1.5rem var(--display);color:var(--bad)}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font-weight:600;font-size:.92rem;min-width:0}
.chip input{width:20px;height:20px;accent-color:var(--sea);flex:none}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}

/* shared bits */
.ring{position:relative;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:400 1.7rem var(--display);font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.log>div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.log b{font-variant-numeric:tabular-nums}
.plus{color:var(--ok);font-weight:700}
.minus{color:var(--bad);font-weight:700}
.meme{background:#000;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/1;width:100%;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px;color:#fff}
.meme .face{font-size:7rem;line-height:1}
.meme .t{font:400 1.6rem/1.05 var(--meme);text-transform:uppercase;text-align:center;text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000}
.scare{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;color:#fff;text-align:center;cursor:pointer;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scare .boo{font-size:min(60vw,320px);line-height:1;animation:boo .6s cubic-bezier(.2,2,.4,1) both, shake .12s linear .6s 6}
.scare p{font:400 1.6rem var(--meme);letter-spacing:.04em}
@keyframes boo{from{transform:scale(.1) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@keyframes shake{0%{transform:translate(8px,-6px)}50%{transform:translate(-8px,6px)}100%{transform:translate(0,0)}}
.status{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.meter .water{transition:none}.rare,.role.liz,.scare .boo{animation:none}.role.liz{background:#f6d365}}
</style>

<div class="stage" id="app"></div>
<div id="overlay"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script>
/* ================= shared data ================= */
const COLORS = [["red","#e5484d"],["orange","#f76b15"],["yellow","#ffc53d"],["green","#30a46c"],["blue","#0090ff"],
  ["purple","#8e4ec6"],["pink","#e93d82"],["brown","#a1662f"],["black","#1c1c1c"],["white","#f5f5f5"]];
const SUBJECTS = ["Math","Science","English","History"];
const NUMBERS = ["1","2","3"];
const SEASONS = ["Winter","Spring","Summer","Fall"];
const QKEYS = [...SUBJECTS.map(s=>"s:"+s), ...NUMBERS.map(n=>"n:"+n), ...SEASONS.map(w=>"w:"+w)];
// Full mode adds more questions on top of the simplified 11, so switching back never needs a redo
const FULL_KEYS = [...QKEYS, ...["Art","Music","Gym"].map(s=>"s:"+s), ...["4","5","6","7","8","9"].map(n=>"n:"+n),
  ...["January","February","March","April","May","June","July","August","September","October","November","December"].map(m=>"m:"+m)];
const keysFor = a => a.keyMode === "full" ? FULL_KEYS : QKEYS;
const KEY_VERSION = 2; // accounts made with the old questions have to redo their color key
// "m:" (months) only exists on old accounts, for the one check before they redo it
const qText = k => { const [t,v] = k.split(":"); return t==="n" ? `What color is the number ${v}?` : `What color is ${v}?`; };
const qGroup = k => ({s:"School subjects",m:"Months",n:"Numbers",w:"Seasons"})[k[0]];

// avatar items: type face | bg | hat | badge. pack items only come from packs; price items from the shop.
const ITEMS = {};
function addItems(list, extra){ list.forEach(([id,type,v,name]) => ITEMS[id] = {id,type,v,name,...extra}); }
addItems([["f-frog","face","🐸","Frog"],["f-cat","face","🐱","Cat"],["f-dog","face","🐶","Dog"],["f-fox","face","🦊","Fox"],
  ["f-panda","face","🐼","Panda"],["f-monkey","face","🐵","Monkey"],["f-lizard","face","🦎","Lizard"],["f-octo","face","🐙","Octopus"],
  ["bg-sky","bg","#4fa3e0","Sky"],["bg-grass","bg","#4caf6a","Grass"],["bg-sun","bg","#f2b134","Sun"],["bg-rose","bg","#e0607e","Rose"],["bg-slate","bg","#5d6d7e","Slate"]], {free:true});
// Item shop catalog. Gbucks are rare, so prices are high; commons and rares are always sold, epics and legendaries rotate weekly.
const RARITY = {
  common:{label:"Common", price:150, color:"#6b8796"},
  rare:{label:"Rare", price:300, color:"#2f80ed"},
  epic:{label:"Epic", price:600, color:"#9b51e0"},
  legendary:{label:"Legendary", price:1200, color:"#f2994a"}
};
const SHOP = {
  common:[["f-tiger","face","🐯","Tiger"],["f-bear","face","🐻","Bear"],["f-pig","face","🐷","Pig"],["f-penguin","face","🐧","Penguin"],
    ["h-cap","hat","🧢","Cap"],["b-star","badge","⭐","Star"],["b-bolt","badge","⚡","Bolt"],["o-vest","outfit","🦺","Safety vest"],
    ["o-jersey","outfit","🎽","Jersey"],["bg-mint","bg","#3fc1a5","Mint"],["bg-ocean","bg","#0369a1","Deep Ocean"]],
  rare:[["f-koala","face","🐨","Koala"],["f-owl","face","🦉","Owl"],["h-top","hat","🎩","Top hat"],["h-grad","hat","🎓","Grad cap"],
    ["b-fire","badge","🔥","Fire"],["b-ball","badge","⚽","Soccer ball"],["b-skate","badge","🛹","Skateboard"],["o-suit","outfit","👔","Shirt and tie"],
    ["o-lab","outfit","🥼","Lab coat"],["bg-candy","bg","#f472b6","Candy"],["bg-lava","bg","#c2410c","Lava"]],
  epic:[["f-lion","face","🦁","Lion"],["f-trex","face","🦖","T-Rex"],["f-pumpkin","face","🎃","Pumpkin"],["h-helmet","hat","⛑️","Rescue helmet"],
    ["h-party","hat","🥳","Party face"],["b-gem","badge","💎","Gem"],["b-guitar","badge","🎸","Guitar"],["b-unicorn","badge","🦄","Unicorn"],
    ["o-kimono","outfit","👘","Kimono"],["o-dress","outfit","👗","Dress"],["bg-gold","bg","#d4a017","Gold"],["bg-midnight","bg","#111827","Midnight"]],
  legendary:[["f-ufo","face","👽","Alien"],["f-skull","face","💀","Skull"],["h-crown","hat","👑","Crown"],["b-dragon","badge","🐉","Dragon"],
    ["b-planet","badge","🪐","Planet"],["b-trophy","badge","🏆","Trophy"],["bg-rainbow","bg","linear-gradient(135deg,#ff5f6d,#ffc371,#47e891,#3fa7ff,#b06cff)","Rainbow"]]
};
Object.entries(SHOP).forEach(([rar,list]) => addItems(list, {rarity:rar, price:RARITY[rar].price}));
// free outfits and items for reaching a level
const LEVEL_REWARDS = {2:["o-tee","outfit","👕","T-shirt"],3:["b-clover","badge","🍀","Lucky clover"],5:["o-coat","outfit","🧥","Coat"],
  7:["h-bow","hat","🎀","Bow"],10:["o-gi","outfit","🥋","Martial arts gi"],13:["b-rainbow","badge","🌈","Rainbow"],
  15:["bg-galaxy","bg","linear-gradient(135deg,#1e1b4b,#6d28d9,#0f172a)","Galaxy"],20:["f-dragon","face","🐲","Dragon"],25:["o-swim","outfit","🩱","Swimsuit"],30:["h-wizard","hat","🧙","Wizard"]};
Object.entries(LEVEL_REWARDS).forEach(([lvl,it]) => addItems([it], {level:+lvl}));

// Firebase drops empty arrays/objects, so fill them back in when an account loads
function fixAccount(a){
  a.items = a.items || []; a.power = Object.assign({hint:0, radio:0, scare:0, letter:0, radar:0, sonar:0}, a.power || {});
  a.wins = Object.assign({lizard:0, tsunami:0}, a.wins || {}); a.colors = a.colors || {};
  a.avatar = Object.assign({face:"f-frog", bg:"bg-sky", hat:null, badge:null, outfit:null}, a.avatar || {});
  a.xp = a.xp || 0; a.level = a.level || 1; a.gbucks = a.gbucks || 0; a.packs = a.packs || 0;
  return a;
}
const clean = o => JSON.parse(JSON.stringify(o)); // strips undefined, which Firebase rejects
function saveLocal(){ try { localStorage.setItem("glitch-game-night", JSON.stringify(DATA)); } catch(e){} }
function saveAccount(a){
  DATA.accounts[a.id] = a;
  if (fdb) ref("accounts/" + a.id).set(clean(a)).catch(e => console.warn("save failed", e)); else saveLocal();
}
function dailyToday(){ const t = today(); DATA.daily[t] = DATA.daily[t] || {lizard:{}, tsunami:{}}; DATA.daily[t].lizard = DATA.daily[t].lizard || {}; DATA.daily[t].tsunami = DATA.daily[t].tsunami || {}; return DATA.daily[t]; }
function addDaily(game, id, pts){
  if (!pts) return;
  const d = dailyToday(); d[game][id] = (d[game][id]||0) + pts;
  // increment on the server so two devices scoring at once don't overwrite each other
  if (fdb) ref(`daily/${today()}/${game}/${id}`).set(firebase.database.ServerValue.increment(pts)); else saveLocal();
}
function initStore(){
  const fallback = () => {
    storeMode = "local";
    try { Object.assign(DATA, JSON.parse(localStorage.getItem("glitch-game-night")) || {}); } catch(e){}
    Object.values(DATA.accounts).forEach(fixAccount);
    rerenderIfCalm();
  };
  if (!window.firebase){ fallback(); return; }
  try {
    const app = firebase.apps.find(x => x.name === "ggn") || firebase.initializeApp(FB_CONFIG, "ggn");
    fdb = app.database();
  } catch(e){ console.warn("Firebase failed", e); fdb = null; fallback(); return; }
  storeMode = "online";
  ref("accounts").on("value", snap => {
    const acc = snap.val() || {};
    Object.values(acc).forEach(fixAccount);
    DATA.accounts = acc; rerenderIfCalm();
  }, e => console.warn("accounts", e));
  ref("daily/" + today()).on("value", snap => { DATA.daily[today()] = snap.val() || {lizard:{}, tsunami:{}}; rerenderIfCalm(); });
}

/* ================= rewards ================= */
function reward(acctId, {xp=0, gb=0}){
  const a = DATA.accounts[acctId]; if (!a) return [];
  const notes = [];
  a.xp += xp; a.gbucks += gb;
  if (a.lastBonus !== today()){ a.lastBonus = today(); a.gbucks += GB.daily; notes.push(`${a.name}: daily bonus +${GB.daily} Gbucks`); }
  while (a.xp >= xpNeed(a.level)){
    a.xp -= xpNeed(a.level); a.level++; a.gbucks += GB.levelUp;
    notes.push(`${a.name} reached level ${a.level}! +${GB.levelUp} Gbucks`);
    const lr = LEVEL_REWARDS[a.level];
    if (lr && !a.items.includes(lr[0])){ a.items.push(lr[0]); notes.push(`${a.name} unlocked ${lr[2]} ${lr[3]}`); }
    if (a.level % PACK_EVERY === 0){ a.packs++; notes.push(`${a.name} earned a free pack 🎁`); }
  }
  saveAccount(a);
  return notes;
}

function finishCreate(pin){

    saveAccount(a);
    if (!S.verified.includes(a.id)) S.verified.push(a.id);
    S.toasts = [c.pinOnly ? "PIN saved." : c.upgrade ? "Full mode is on. Logins can ask any of your " + FULL_KEYS.length + " questions." : "Color key saved!" + (pin ? " PIN saved too." : "")];
    afterLogin(a, c.next || {view:"profile"});
    return;
  }
  const a = newAccount(c.name, c.face, c.bg, c.colors, pin);
  a.keyMode = c.mode || "simple";

function padHtml(val){

}
function bindPad(app, get, set){
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {

/* ================= color login ================= */
function startQuiz(id, then){
  const a = DATA.accounts[id];
  // old accounts are checked once with their old questions, then have to redo the key
  const pool = a && a.keyVersion === KEY_VERSION ? keysFor(a) : Object.keys((a && a.colors) || {});
  S.quiz = {id, pool, qs:shuffle(pool).slice(0,3), i:0, ans:[], then, fails:0, mode:"colors", pin:"", pinFails:0};
  go("quiz");
}
function afterLogin(a, then){
  if (!S.verified.includes(a.id)) S.verified.push(a.id);
  if (a.keyVersion !== KEY_VERSION){
    S.verified = S.verified.filter(x => x !== a.id); // not fully logged in until the new key is made
    go("create", {create:{step:"colors", redo:a.id, name:a.name, qi:0, colors:{}, then:"redo", next:then}});
    return;
  }
  if (then.view === "lobby"){ addPlayer({acct:a.id}); go("lobby"); }
  else if (then.view === "shop") go("shop", {shop:{id:a.id, sel:null}});
  else if (then.view === "online"){ const o = O(); o.acct = a.id; o.guest = null; o.step = "menu"; go("online"); }
  else go("profile", {profile:{id:a.id, tab:"avatar"}});
}
function renderQuiz(app){
  const q = S.quiz, a = DATA.accounts[q.id];

  const head = `<div class="spread"><span class="row">${avatarHtml(a.avatar,"sm")}<b>${esc(a.name)}</b></span><button class="ghost small" id="back">Cancel</button></div>`;
  if (q.mode === "pin"){

        <button class="ghost small" id="mode">Use my colors instead</button>
      </div>`;
    bindPad(app, () => q.pin, v => { q.pin = v;

      q.pinFails++; q.pin = ""; render();

  } else {

        <div class="qbig">${esc(qText(k))}</div>

        ${q.fails ? `<p class="minus">Nope, that didn't match. Here are 3 new ones.</p>` : `<p class="small-print">Everyone else look away.</p>`}
        ${a.pin ? `<button class="ghost small" id="mode">Log in with my PIN instead</button>` : ""}

/* ================= item shop: commons + rares always in stock, epic/legendary featured weekly ================= */
function seeded(seed){
  let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// the shop resets every Monday at midnight
function weekStart(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d; }
function shopFeatured(){
  const w = weekStart(), rnd = seeded("shop-week-" + w.getFullYear()+"-"+(w.getMonth()+1)+"-"+w.getDate());
  const take = (list, n) => { const a = list.slice(), out = []; while (out.length < n && a.length) out.push(a.splice(Math.floor(rnd()*a.length), 1)[0][0]); return out; };
  return [...take(SHOP.legendary,2), ...take(SHOP.epic,4)];
}
const shopAlways = () => [...SHOP.rare, ...SHOP.common].map(x => x[0]);
function untilReset(){ const m = weekStart(); m.setDate(m.getDate()+7); const mins = Math.ceil((m-new Date())/60000), d = Math.floor(mins/1440), h = Math.floor(mins%1440/60);
  return d ? `${d}d ${h}h` : `${h}h ${mins%60}m`; }
function renderShop(app){
  const sh = S.shop || (S.shop = {id:null, sel:null});

  S.toasts = [];

      <button class="ghost small" id="cancel">Close</button></div>`;
  }
  app.innerHTML = `

    saveAccount(a); render();
  };
}

function jumpscare(by, then){
  const o = $("#overlay");
  o.innerHTML = `<div class="scare" role="dialog" aria-label="Jumpscare"><div><div class="boo">👹</div><p>GET TROLLED BY ${esc(by).toUpperCase()}</p><p style="font-size:1rem;font-family:var(--body);opacity:.7">tap to continue</p></div></div>`;
  try {
    const ac = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ac.createOscillator(), g = ac.createGain();
    osc.type = "sawtooth"; osc.frequency.setValueAtTime(900, ac.currentTime); osc.frequency.exponentialRampToValueAtTime(140, ac.currentTime + .7);
    g.gain.setValueAtTime(.25, ac.currentTime); g.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .8);
    osc.connect(g).connect(ac.destination); osc.start(); osc.stop(ac.currentTime + .8);
  } catch(e){}
  o.firstChild.onclick = () => { o.innerHTML = ""; then(); };
}

function lizNewRound(){
  const l = S.lobby.lizard, n = l.players.length;
  const cat = l.cat === "Random" ? pick(Object.keys(CATS)) : l.cat;
  let count = l.lizards;
  if (count === "R"){ const roll = Math.random(); count = roll < .1 ? 3 : roll < .3 ? 2 : 1; }
  const liz = shuffle([...Array(n).keys()]).slice(0, Math.min(+count, n));
  const start = Math.floor(Math.random()*n);
  S.liz.r = { cat, word:pick(CATS[cat]), liz, turn:0, phase:"blank", order:[...Array(n).keys()].map(k => (start+k)%n),

      </div>`;
    $("#next").onclick = () => {
      if (last){ r.phase = "clues"; }
      else { r.turn++; r.phase = "role"; if (r.scareSet){ r.scareBy = r.scareSet; r.scareSet = null; } }
      render();
    };
    if (left > 0) timer = setInterval(() => { left = leftNow(); $("#sec").textContent = left; $("#arc").setAttribute("stroke-dashoffset", arc(left)); if (left <= 0) stopTimer(); }, 250);
    return;
  }
  if (r.phase === "clues"){
    app.innerHTML = bar + `
      <div class="card">
        <div class="eyebrow">Round on</div>
        <h2>Everyone says one word about it</h2>
        <p>Go in this order. Be vague enough that the lizard can't guess the word, but clear enough that your team trusts you. Then point at who you think the lizard is on 3.</p>
        <div class="order">${r.order.map(k => `<span>${esc(nm(k))}</span>`).join("")}</div>
        <p class="small-print">${esc(nm(r.order[0]))} starts.</p>
      </div>
      <button class="big" id="reveal">Reveal the lizard</button>`;
    $("#reveal").onclick = () => { r.phase = "reveal"; render(); };
    return;
  }
  if (r.phase === "reveal"){
    const lizNames = r.liz.map(nm).join(" & ");
    const scores = [...Array(n).keys()].map(k => [k, G.scores[k]||0]).sort((a,b) => b[1]-a[1]);
    app.innerHTML = bar + `
      <div class="card role liz">
        <div class="eyebrow">${r.liz.length>1 ? r.liz.length + " lizards! They were" : "The lizard was"}</div>
        <div class="word">${esc(lizNames)}</div>
        <p>The word was <b>${esc(r.word)}</b></p>
      </div>
      <div class="card">
        <div class="eyebrow">Who won?</div>
        <p class="small-print">If the group caught the lizard, the lizard gets one guess at the word to steal the win.</p>
        ${r.outcome ? `<p><b>${{team:"Team wins! +1 to everyone in on it.", steal:"Lizard stole it! +1 to each lizard.", lizard:"Lizard escaped! +3 to each lizard."}[r.outcome]}</b></p>`
          : `<div class="row"><button class="small" data-o="team">Team caught it</button><button class="small" data-o="steal">Caught, but lizard guessed the word</button><button class="small" data-o="lizard">Lizard escaped</button></div>`}
      </div>
      ${rewardLines(r.notes)}
      ${memeHtml(r.memeB, "🦎")}
      <div class="card"><div class="eyebrow">This game</div><div class="log">${scores.map(([k,s]) => `<div><span class="row">${avatarHtml(playerAv(P[k]),"sm")} ${esc(nm(k))}</span><b>${s}</b></div>`).join("")}</div></div>
      <button class="big" id="again" ${r.outcome?"":"disabled"}>Next round</button>
      <button class="ghost" id="lobby">Back to the lobby</button>`;
    app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      if (r.outcome) return;
      r.outcome = b.dataset.o;
      for (let k=0;k<n;k++){
        const isLiz = r.liz.includes(k);
        const p = r.outcome==="team" ? (isLiz?0:1) : r.outcome==="steal" ? (isLiz?1:0) : (isLiz?3:0);
        G.scores[k] = (G.scores[k]||0) + p;
        const pl = P[k];
        if (pl.acct && DATA.accounts[pl.acct]){
          const a = DATA.accounts[pl.acct];
          if (p > 0){ a.wins.lizard++; addDaily("lizard", pl.acct, p); }
          r.notes.push(`${a.name}: +${p > 0 ? 25 : 10} XP`);
          r.notes.push(...reward(pl.acct, {xp: p > 0 ? 25 : 10}));
        }
      }
      render();
    });
    $("#again").onclick = lizNewRound;
    $("#lobby").onclick = () => go("lobby", {game:"lizard"});
  }
}

];
const TSU_MEMES = [["The clue: \"lukewarm soup\"","Me: full send to HOT"],["Me landing it","right on the 4"],["Family game night","becomes family war night"],["When everyone","gets wiped out"]];
const tpts = (d, k=1) => d<=4*k ? 4 : d<=10*k ? 3 : d<=17*k ? 2 : 0;
const tpool = () => { const l = S.lobby.tsunami; return (l.packs && l.packs.length ? l.packs : Object.keys(TPACKS)).flatMap(p => TPACKS[p]); };

function tsuNewRound(){
  const l = S.lobby.tsunami, G = S.tsu, n = l.players.length;
  const chance = {off:0, rare:1/6, chaos:1/2}[l.rare];
  const mode = Math.random() < chance ? pick(MODES) : null;
  const scale = mode && mode.id === "whirlpool" ? [pick(tpool())[0], pick(tpool())[1]] : pick(tpool());
  G.giver = G.giver % n;
  const guessers = [...Array(n).keys()].filter(i => i !== G.giver);
  G.r = { scale, target:rint(3,97), mode, guessers, gi:0, pins:{}, radio:{}, sonar:{}, phase:"pass", meme:pick(TSU_MEMES), scored:false, scareSet:null, scareBy:null, notes:[] };
  G.round++;
  go("tsu");
}
function meterHtml({target=null, k=1, pins=[], zone=null, sonar=null}){
  let inner = `<div class="water" id="water"></div>`;
  if (zone !== null) inner += `<div class="zone" style="left:${zone*25}%;width:25%"></div>`;
  if (sonar !== null) inner += `<div class="zone" style="left:${sonar}%;width:10%"></div>`;
  if (target !== null){
    inner += `<div class="band b2" style="left:${target}%;width:${34*k}%"></div><div class="band b3" style="left:${target}%;width:${20*k}%"></div>
      <div class="band b4" style="left:${target}%;width:${8*k}%"><span>${k<1?"":"4"}</span></div>`;
  }
  pins.forEach(p => inner += `<div class="pin ${p.v>70?"right":""}" style="left:${p.v}%"><b>${esc(p.label)}</b></div>`);
  return `<div class="meter" role="img" aria-label="Meter">${inner}</div><div class="ticks"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>`;
}
const endsHtml = sc => `<div class="ends"><span>← ${esc(sc[0])}</span><span>${esc(sc[1])} →</span></div>`;
const modeHtml = m => m ? `<div class="rare"><div class="eyebrow">Rare mode!</div><b>${m.icon} ${esc(m.name)}</b><p>${esc(m.text)}</p></div>` : "";

    app.innerHTML = `
      <div class="card center"><div class="eyebrow">Tsunami champion</div>${avatarHtml(playerAv(P[c]),"lg")}<div class="who">🏄 ${esc(nm(c))}</div>
        <p>rode the wave to ${G.scores[c]} points.</p>${P[c].acct ? `<p class="gb">+50 XP and +30 Gbucks for the win</p>` : ""}</div>
      ${rewardLines(r.champNotes||[])}
      ${memeHtml(["Everyone else","after getting wiped out"], "🌊")}
      ${scoreCard()}
      <button class="big" id="again">Play again</button>
      <button class="ghost" id="hub">Back to the hub</button>`;
    $("#again").onclick = () => { S.tsu = {scores:{}, giver:0, round:0, r:null}; tsuNewRound(); };
    $("#hub").onclick = () => go("home");
  }
}
function tsuScore(){
  const l = S.lobby.tsunami, P = l.players, n = P.length, G = S.tsu, r = G.r, m = r.mode;
  const k = (m && m.band) || 1, mult = (m && m.mult) || 1, nm = i => playerName(P[i]);
  const add = (i, v) => { G.scores[i] = Math.max(0, (G.scores[i]||0) + v); };
  const leaderBefore = [...Array(n).keys()].sort((a,b) => (G.scores[b]||0) - (G.scores[a]||0))[0];
  const gained = {};
  r.res = r.guessers.map(i => ({i, pin:r.pins[i], d:Math.abs(r.pins[i]-r.target)})).map(x => ({...x, p:tpts(x.d,k)*mult}));
  r.lines = [];
  const best = Math.min(...r.res.map(x => x.d));
  r.allMiss = r.res.every(x => x.p === 0);
  const winners = [];
  r.res.forEach(x => {
    const scores = l.scoring === "wta" ? (x.d === best && x.p > 0) : x.p > 0;
    if (scores){ add(x.i, x.p); gained[x.i] = (gained[x.i]||0) + x.p; winners.push(x.i); r.lines.push([nm(x.i), `+${x.p}${l.scoring==="wta"?" (closest)":""}`, "plus"]); }
    else r.lines.push([nm(x.i), x.p ? `${x.d} away, beaten` : "wiped out 🌊"]);
  });
  const g = G.giver;
  if (r.allMiss){ add(g, -1); r.lines.push([nm(g) + " (clue-giver)", "−1, nobody landed it", "minus"]); }
  else if (l.scoring === "all"){ const avg = Math.round(r.res.reduce((a,x) => a+x.p, 0) / r.res.length); add(g, avg); gained[g] = (gained[g]||0) + avg; r.lines.push([nm(g) + " (clue-giver)", "+" + avg, "plus"]); }
  else r.lines.push([nm(g) + " (clue-giver)", "safe"]);
  if (m && m.id === "shark" && winners.length){
    const thief = winners[0];
    if (leaderBefore !== thief && (G.scores[leaderBefore]||0) > 0){
      const take = Math.min(2, G.scores[leaderBefore]);
      add(leaderBefore, -take); add(thief, take); gained[thief] = (gained[thief]||0) + take;
      r.lines.push(["🦈 Shark Bite", `${nm(thief)} steals ${take} from ${nm(leaderBefore)}`, "minus"]);
    }
  }
  // account rewards: everyone with an account gets play XP, scorers get Gbucks + daily points
  for (let i=0;i<n;i++){
    const pl = P[i]; if (!pl.acct || !DATA.accounts[pl.acct]) continue;
    const p = gained[i] || 0;
    r.notes.push(`${DATA.accounts[pl.acct].name}: +${10+p*2} XP`);
    r.notes.push(...reward(pl.acct, {xp: 10 + p*2}));
    if (p) addDaily("tsunami", pl.acct, p);
  }
  const top = [...Array(n).keys()].filter(i => (G.scores[i]||0) >= l.win).sort((a,b) => G.scores[b]-G.scores[a]);
  r.champ = top.length ? top[0] : null;
  if (r.champ !== null && P[r.champ].acct && DATA.accounts[P[r.champ].acct]){
    const a = DATA.accounts[P[r.champ].acct]; a.wins.tsunami++;
    r.champNotes = reward(a.id, {xp:50, gb:GB.champ});
  }
  r.scored = true;
}

const rPlayers = () => ROOM && ROOM.players ? Object.entries(ROOM.players).sort((a,b) => a[1].order - b[1].order).map(([dev,p]) => ({dev, ...p})) : [];
const rName = dev => { const p = ROOM && ROOM.players && ROOM.players[dev]; if (!p) return "Someone"; return p.acct && DATA.accounts[p.acct] ? DATA.accounts[p.acct].name : p.name; };
const rAv = dev => { const p = ROOM && ROOM.players && ROOM.players[dev]; return p && p.acct && DATA.accounts[p.acct] ? DATA.accounts[p.acct].avatar : guestAv; };
const isHost = () => ROOM && ROOM.host === DEVICE;

async function hostRoom(game){
  const o = O();
  if (!fdb){ o.err = "Online rooms need an internet connection."; render(); return; }
  // tidy up rooms nobody has used for a day
  ref("rooms").orderByChild("created").endAt(Date.now() - 864e5).once("value", s => s.forEach(c => { c.ref.remove(); }));
  let code;
  for (let t = 0; t < 6; t++){ code = makeCode(); if (!(await ref("rooms/" + code).get()).exists()) break; }
  const l = S.lobby[game];
  const settings = game === "lizard" ? {cat:l.cat, lizards:l.lizards} : {packs:l.packs || Object.keys(TPACKS), rare:l.rare, scoring:l.scoring, win:l.win};
  await ref("rooms/" + code).set(clean({game, host:DEVICE, created:Date.now(), settings}));
  joinRoom(code);
}
async function joinRoom(code){
  const o = O(); code = (code || "").toUpperCase().trim();
  if (!fdb){ o.err = "Online rooms need an internet connection."; render(); return; }
  if (!/^[A-Z]{4}$/.test(code)){ o.err = "Room codes are 4 letters."; render(); return; }
  const snap = await ref("rooms/" + code).get();
  if (!snap.exists()){ o.err = `There's no room called ${code}. Check the code.`; render(); return; }
  const me = onlineMe();
  const pref = ref(`rooms/${code}/players/${DEVICE}`);
  await pref.set(clean({name:me.name, acct:me.acct, order:Date.now()}));
  pref.onDisconnect().remove();
  o.code = code; o.err = ""; o.step = "room";
  if (roomOff) roomOff();
  const rr = ref("rooms/" + code);
  const cb = rr.on("value", s => { ROOM = s.val(); onRoomChange(); });
  roomOff = () => rr.off("value", cb);
  go("online");
}
function leaveRoom(){
  const o = O();
  if (o.code) ref(`rooms/${o.code}/players/${DEVICE}`).remove();
  if (roomOff) roomOff();
  roomOff = null; ROOM = null; o.code = null; o.step = "menu"; go("online");
}
function onRoomChange(){
  const o = O();
  if (!ROOM || !ROOM.players || !ROOM.players[DEVICE]){
    if (o.step === "room"){ if (roomOff) roomOff(); roomOff = null; ROOM = null; o.code = null; o.step = "menu"; o.err = "You're no longer in that room."; }
    if (S.view === "online") render();
    return;
  }
  // the host left: the next player in line takes over
  const ps = rPlayers();
  if (!ROOM.players[ROOM.host] && ps[0].dev === DEVICE) roomRef("host").set(DEVICE);
  // someone trolled me
  const by = ROOM.scares && ROOM.scares[DEVICE];
  if (by){ roomRef("scares/" + DEVICE).remove(); jumpscare(by, () => { if (S.view === "online") render(); }); }
  applyOnlineRewards();
  if (isHost()) hostAutomation();
  if (S.view === "online") render();
}

function hostAutomation(){

function tsuStartOnline(resetScores){
  const ps = rPlayers().map(p => p.dev), st = ROOM.settings || {};
  if (ps.length < 2) return;
  const prev = ROOM.round && ROOM.round.giver;
  const giver = ps[prev && ps.includes(prev) ? (ps.indexOf(prev)+1) % ps.length : 0];
  const chance = {off:0, rare:1/6, chaos:1/2}[st.rare || "rare"];
  const mode = Math.random() < chance ? pick(MODES) : null;
  const pool = (st.packs && st.packs.length ? st.packs : Object.keys(TPACKS)).flatMap(p => TPACKS[p] || []);
  const scale = mode && mode.id === "whirlpool" ? [pick(pool)[0], pick(pool)[1]] : pick(pool);
  const upd = {round:{id:Date.now(), n:((ROOM.round && ROOM.round.n) || 0) + 1, scale, target:rint(3,97), mode:mode ? mode.id : null, giver, players:ps, phase:"clue"}, pins:null, scares:null};
  if (resetScores){ upd.scores = null; upd.round.n = 1; }
  roomRef().update(clean(upd));
}
function tsuScoreOnline(guessers, pins){
  const r = ROOM.round, st = ROOM.settings || {}, m = MODES.find(x => x.id === r.mode) || null;
  const k = (m && m.band) || 1, mult = (m && m.mult) || 1, scoring = st.scoring || "wta";
  const sc = Object.assign({}, ROOM.scores || {});
  const add = (d, v) => { sc[d] = Math.max(0, (sc[d]||0) + v); };
  const leaderBefore = r.players.slice().sort((a,b) => (sc[b]||0) - (sc[a]||0))[0];
  const gained = {_:0};
  const res = guessers.map(d => ({d, pin:pins[d], dist:Math.abs(pins[d] - r.target)})).map(x => ({...x, p:tpts(x.dist, k) * mult}));
  const best = Math.min(...res.map(x => x.dist)), allMiss = res.every(x => x.p === 0);
  const lines = [], winners = [];
  res.forEach(x => {
    const scores = scoring === "wta" ? (x.dist === best && x.p > 0) : x.p > 0;
    if (scores){ add(x.d, x.p); gained[x.d] = (gained[x.d]||0) + x.p; winners.push(x.d); lines.push([rName(x.d), `+${x.p}${scoring==="wta" ? " (closest)" : ""}`, "plus"]); }
    else lines.push([rName(x.d), x.p ? `${x.dist} away, beaten` : "wiped out 🌊", "-"]);
  });
  const g = r.giver;
  if (allMiss){ add(g, -1); lines.push([rName(g) + " (clue-giver)", "−1, nobody landed it", "minus"]); }
  else if (scoring === "all"){ const avg = Math.round(res.reduce((s,x) => s + x.p, 0) / res.length); add(g, avg); gained[g] = (gained[g]||0) + avg; lines.push([rName(g) + " (clue-giver)", "+" + avg, "plus"]); }
  else lines.push([rName(g) + " (clue-giver)", "safe", "-"]);
  if (m && m.id === "shark" && winners.length){
    const thief = winners[0];
    if (leaderBefore !== thief && (sc[leaderBefore]||0) > 0){
      const take = Math.min(2, sc[leaderBefore]);
      add(leaderBefore, -take); add(thief, take); gained[thief] = (gained[thief]||0) + take;
      lines.push(["🦈 Shark Bite", `${rName(thief)} steals ${take} from ${rName(leaderBefore)}`, "minus"]);
    }
  }
  const top = r.players.filter(d => (sc[d]||0) >= (st.win || 15)).sort((a,b) => sc[b] - sc[a]);
  roomRef().update(clean({"round/phase":"reveal", "round/res":res.map(x => ({d:x.d, pin:x.pin})), "round/lines":lines, "round/gained":gained,
    "round/allMiss":allMiss, "round/champ":top.length ? top[0] : null, scores:sc}));
}

}
function scarePicker(r){
  const o = O(); if (!o.acct || !DATA.accounts[o.acct] || !(DATA.accounts[o.acct].power.scare > 0)) return "";
  const others = r.players.filter(d => d !== DEVICE && ROOM.players[d]);
  if (!others.length) return "";
  return `<div class="row" style="flex-wrap:nowrap"><select id="scareWho" aria-label="Who to jumpscare">${others.map(d => `<option value="${d}">${esc(rName(d))}</option>`).join("")}</select>
    <button class="power" id="usescare">👻 Jumpscare <span class="tag">have ${DATA.accounts[o.acct].power.scare}</span></button></div>`;
}
function bindScare(){
  const b = $("#usescare"); if (!b) return;
  b.onclick = () => { const who = $("#scareWho").value, o = O();
    if (spendPower({acct:o.acct}, "scare")){ roomRef("scares/" + who).set(onlineMe().name); S.toasts = []; b.parentElement.outerHTML = `<p class="small-print">👻 Sent! ${esc(rName(who))} is getting jumpscared.</p>`; } };
}
const notesHtml = r => { const o = O(); return o.notesRound === r.id ? rewardLines(o.notes || []) : ""; };

function renderLizOnline(app){
  const r = ROOM.round, o = O(), host = isHost(), me = DEVICE;
  const bar = `<div class="public"><div><div class="eyebrow">Category · everyone knows</div><b>${esc(r.cat)}</b></div>
    <div class="eyebrow" style="text-align:right">Room ${esc(o.code)}<br>${(ROOM.settings||{}).lizards==="R" ? "? lizards" : r.liz.length + " lizard" + (r.liz.length>1?"s":"")}</div></div>`;
  if (!r.players.includes(me)){
    app.innerHTML = bar + `<div class="card center"><h3>You joined mid-round</h3><p class="small-print">You'll get a role next round.</p></div>${roomScores()}${roomFoot()}`;
    bindFoot(); return;
  }
  if (o.showRound !== r.id){ o.showRound = r.id; o.show = false; o.hint = false; o.letter = false; o.radar = undefined; }
  if (r.phase === "roles"){
    const ready = ROOM.ready || {}, isLiz = r.liz.includes(me), showHint = isLiz && (r.order[0] === me || o.hint);
    const nReady = r.players.filter(d => ready[d]).length;
    const role = o.show ? `
      <div class="card role ${isLiz?"liz":""}">
        <div class="eyebrow">${esc(rName(me))}, you are</div>
        ${isLiz ? `<div class="word">🦎 THE LIZARD</div><p>You don't know the word. Fake it. Blend in.</p>
            ${showHint ? `<p class="hintbox"><b>${r.order[0]===me ? "You're giving the first clue, so here's a hint:" : "🔍 Lizard Hint:"}</b><br>"${esc(hintFor(r.cat, r.word))}"</p>` : ""}`
          : `<p>In on it. The secret word is</p><div class="word">${esc(r.word)}</div>`}
        ${extraPowerInfo(isLiz, o.letter ? r.word : null, o.radar)}
      </div>
      ${isLiz && !showHint ? powerBtn({acct:o.acct}, "hint", "usehint", "Use Lizard Hint") : ""}
      ${isLiz && !o.letter ? powerBtn({acct:o.acct}, "letter", "useletter", "Use First Letter") : ""}
      ${!isLiz && o.radar === undefined ? powerBtn({acct:o.acct}, "radar", "useradar", "Use Lizard Radar") : ""}
      <button class="ghost" id="hide">Hide my role</button>`
      : `<div class="card center" style="min-height:200px;justify-content:center"><h3>Your role is hidden</h3><p class="small-print">Make sure nobody can see your screen.</p><button class="big" id="show">Show my role</button></div>`;
    app.innerHTML = bar + role + scarePicker(r) + `
      <div class="card"><div class="spread"><h3>Ready? ${nReady}/${r.players.length}</h3>${ready[me] ? `<span class="tag">✓ you're ready</span>` : `<button class="small" id="ready">I've seen it, I'm ready</button>`}</div>
        <div class="order">${r.players.map(d => `<span>${ready[d] ? "✓ " : ""}${esc(rName(d))}</span>`).join("")}</div></div>
      ${host ? `<button class="big" id="go">${nReady >= r.players.length ? "Everyone's ready, start clues" : "Start clues anyway"}</button>` : ""}
      ${roomFoot()}`;
    const sh = $("#show"); if (sh) sh.onclick = () => { o.show = true; render(); };
    const hd = $("#hide"); if (hd) hd.onclick = () => { o.show = false; render(); };
    const uh = $("#usehint"); if (uh) uh.onclick = () => { if (spendPower({acct:o.acct}, "hint")){ o.hint = true; render(); } };
    const ul = $("#useletter"); if (ul) ul.onclick = () => { if (spendPower({acct:o.acct}, "letter")){ o.letter = true; render(); } };
    const ua = $("#useradar"); if (ua) ua.onclick = () => { if (spendPower({acct:o.acct}, "radar")){
      const safe = r.players.filter(d => d !== me && !r.liz.includes(d));
      o.radar = safe.length ? rName(pick(safe)) : null; render(); } };
    const rd = $("#ready"); if (rd) rd.onclick = () => { o.show = false; roomRef("ready/" + me).set(true); };
    const g = $("#go"); if (g) g.onclick = () => roomRef("round/phase").set("clues");
    bindScare(); bindFoot(); return;
  }
  if (r.phase === "clues"){
    app.innerHTML = bar + `
      <div class="card"><div class="eyebrow">Round on</div><h2>Everyone says one word about it</h2>
        <p>Go in this order. Be vague enough that the lizard can't guess the word, but clear enough that your team trusts you. Then vote on who the lizard is.</p>
        <div class="order">${r.order.map(d => `<span>${esc(rName(d))}</span>`).join("")}</div>
        <p class="small-print">${esc(rName(r.order[0]))} starts.</p></div>
      <button class="ghost" id="peek">${o.show ? "Hide" : "Peek at"} my role</button>
      ${o.show ? `<div class="card center"><b>${r.liz.includes(me) ? "🦎 You're the lizard" : "The word is " + esc(r.word)}</b></div>` : ""}
      ${host ? `<button class="big" id="reveal">Reveal the lizard</button>` : `<p class="small-print" style="text-align:center">${esc(rName(ROOM.host))} reveals the lizard when you're done.</p>`}
      ${roomFoot()}`;
    $("#peek").onclick = () => { o.show = !o.show; render(); };
    const rv = $("#reveal"); if (rv) rv.onclick = () => roomRef("round/phase").set("reveal");
    bindFoot(); return;
  }
  // reveal
  app.innerHTML = bar + `
    <div class="card role liz"><div class="eyebrow">${r.liz.length>1 ? r.liz.length + " lizards! They were" : "The lizard was"}</div>
      <div class="word">${esc(r.liz.map(rName).join(" & "))}</div><p>The word was <b>${esc(r.word)}</b></p></div>
    <div class="card"><div class="eyebrow">Who won?</div>
      ${r.outcome ? `<p><b>${{team:"Team wins! +1 to everyone in on it.", steal:"Lizard stole it! +1 to each lizard.", lizard:"Lizard escaped! +3 to each lizard."}[r.outcome]}</b></p>`
        : host ? `<p class="small-print">If the group caught the lizard, the lizard gets one guess at the word to steal the win.</p>
          <div class="row"><button class="small" data-o="team">Team caught it</button><button class="small" data-o="steal">Caught, but lizard guessed the word</button><button class="small" data-o="lizard">Lizard escaped</button></div>`
        : `<p class="small-print">Waiting for ${esc(rName(ROOM.host))} to pick who won…</p>`}</div>
    ${notesHtml(r)}
    ${memeHtml(r.memeB, "🦎")}
    ${roomScores()}
    ${host ? `<button class="big" id="again" ${r.outcome?"":"disabled"}>Next round</button>` : ""}
    ${roomFoot()}`;
  app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => lizOutcomeOnline(b.dataset.o));
  const ag = $("#again"); if (ag) ag.onclick = lizStartOnline;
  bindFoot();
}

function renderTsuOnline(app){
  const r = ROOM.round, o = O(), host = isHost(), me = DEVICE, st = ROOM.settings || {};
  const m = MODES.find(x => x.id === r.mode) || null, k = (m && m.band) || 1, giverName = rName(r.giver);
  if (!r.players.includes(me)){
    app.innerHTML = `<div class="card center"><h3>You joined mid-round</h3><p class="small-print">You'll be in the next round.</p></div>${roomScores()}${roomFoot()}`;
    bindFoot(); return;
  }
  if (o.curRound !== r.id){ o.curRound = r.id; o.cur = 50; o.radio = false; o.sonar = null; o.deadline = null; }
  const head = `<div class="spread"><span class="eyebrow">Round ${r.n} · Room ${esc(o.code)}</span>${avatarHtml(rAv(r.giver),"sm")}</div>${modeHtml(m)}`;
  if (r.phase === "clue"){
    if (r.giver === me){
      const rev = m && m.id === "reverse";
      app.innerHTML = head + `
        <div class="card"><div class="eyebrow">Only you can see this</div>
          ${endsHtml(r.scale)}${meterHtml({target:r.target, k})}
          <p>The target is at <b>${r.target}</b>. ${rev ? `<b>Reverse Tide:</b> give a clue for <b>${100-r.target}</b> instead, the mirror spot.` : `Think of one thing that sits right there between <b>${esc(r.scale[0])}</b> and <b>${esc(r.scale[1])}</b>.`}</p>
          ${m && (m.id==="silent"||m.id==="sound") ? `<p><b>${esc(m.name)}:</b> ${esc(m.text)}</p>` : ""}</div>
        ${scarePicker(r)}
        <button class="big" id="said">I've said my clue out loud</button>${roomFoot()}`;
      $("#said").onclick = () => roomRef("round/phase").set("guess");
      bindScare();
    } else {
      app.innerHTML = head + `<div class="card center" style="min-height:220px;justify-content:center">
          ${endsHtml(r.scale)}<h3>${esc(giverName)} is thinking of a clue…</h3><p class="small-print">Listen for it, then place your pin.</p></div>
        ${scarePicker(r)}${roomScores()}${roomFoot()}`;
      bindScare();
    }
    bindFoot(); return;
  }
  if (r.phase === "guess"){
    const pins = ROOM.pins || {}, guessers = r.players.filter(d => d !== r.giver && ROOM.players[d]);
    const status = `<div class="order">${guessers.map(d => `<span>${pins[d] !== undefined ? "🔒 " : "… "}${esc(rName(d))}</span>`).join("")}</div>`;
    if (r.giver === me || pins[me] !== undefined){
      app.innerHTML = head + `<div class="card center">${endsHtml(r.scale)}
          <h3>${r.giver === me ? "Guessers are placing their pins" : `Locked in at ${pins[me]}`}</h3>${status}
          <p class="small-print">The wave hits once everyone locks in.</p></div>${scarePicker(r)}${roomFoot()}`;
      bindScare(); bindFoot(); return;
    }
    const speed = m && m.id === "speed";
    if (speed && !o.deadline) o.deadline = Date.now() + 10000;
    const zone = o.radio ? Math.min(3, Math.floor(r.target/25)) : null;
    app.innerHTML = head + `
      <div class="card">
        <div class="eyebrow">Your guess${speed ? ` · <span id="spd">${Math.max(0, Math.ceil((o.deadline - Date.now())/1000))}</span>s left` : ""}</div>
        <h2>${m && m.id==="reverse" ? "Where is the REAL target?" : "Where does " + esc(giverName) + "'s clue land?"}</h2>
        ${endsHtml(r.scale)}${meterHtml({pins:[{v:o.cur, label:rName(me)}], zone, sonar:o.sonar})}
        ${zone !== null ? `<p class="small-print">📻 Radio says the target is somewhere between <b>${zone*25}</b> and <b>${zone*25+25}</b>.</p>` : ""}
        ${o.sonar !== null ? `<p class="small-print">🔊 Sonar says the target is between <b>${o.sonar}</b> and <b>${o.sonar+10}</b>.</p>` : ""}
        <label for="pin" class="small-print">Drag to place your pin</label>
        <input type="range" id="pin" min="0" max="100" value="${o.cur}">
        <div class="readout" id="ro">${o.cur}</div>
      </div>
      ${zone === null ? powerBtn({acct:o.acct}, "radio", "useradio", "Use Radio") : ""}
      ${o.sonar === null ? powerBtn({acct:o.acct}, "sonar", "usesonar", "Use Sonar") : ""}
      <button class="big" id="lock">Lock in</button>
      <div class="card">${status}</div>${roomFoot()}`;
    const pin = $("#pin"), pinEl = app.querySelector(".pin");
    pin.oninput = () => { o.cur = +pin.value; $("#ro").textContent = pin.value; pinEl.style.left = pin.value + "%"; pinEl.classList.toggle("right", pin.value > 70); };
    const lock = () => { stopTimer(); roomRef("pins/" + me).set(o.cur); };
    $("#lock").onclick = lock;
    const ur = $("#useradio"); if (ur) ur.onclick = () => { if (spendPower({acct:o.acct}, "radio")){ o.radio = true; render(); } };
    const un = $("#usesonar"); if (un) un.onclick = () => { if (spendPower({acct:o.acct}, "sonar")){ o.sonar = sonarWindow(r.target); render(); } };
    if (speed) timer = setInterval(() => { const left = Math.max(0, Math.ceil((o.deadline - Date.now())/1000)); const el = $("#spd"); if (el) el.textContent = left; if (left <= 0) lock(); }, 250);
    bindFoot(); return;
  }
  if (r.phase === "reveal"){
    const pins = (r.res || []).map(x => ({v:x.pin, label:rName(x.d)}));
    app.innerHTML = `${modeHtml(m)}
      <div class="card"><div class="eyebrow">The wave hits ${r.target}</div>
        ${endsHtml(r.scale)}${meterHtml({target:r.target, k, pins})}
        <div class="log">${(r.lines || []).map(([who,txt,cls]) => `<div><span>${esc(who)}</span><span class="${cls==="-"?"":cls}">${esc(txt)}</span></div>`).join("")}</div>
        <p class="small-print">${(st.scoring||"wta")==="wta" ? "Winner takes all: only the closest guesser scores." : "Everyone scores."} Dark band = 4, middle = 3, light = 2.</p></div>
      ${notesHtml(r)}
      ${r.allMiss ? memeHtml(TSU_MEMES[r.id % TSU_MEMES.length], "🌊") : ""}
      ${roomScores()}
      ${host ? `<button class="big" id="next">${r.champ ? "See the champion" : "Next round"}</button>` : `<p class="small-print" style="text-align:center">${esc(rName(ROOM.host))} starts the next round.</p>`}
      ${roomFoot()}`;
    requestAnimationFrame(() => requestAnimationFrame(() => { const w = $("#water"); if (w) w.style.width = r.target + "%"; }));
    const nx = $("#next"); if (nx) nx.onclick = () => r.champ ? roomRef("round/phase").set("champ") : tsuStartOnline(false);
    bindFoot(); return;
  }
  // champion
  app.innerHTML = `
    <div class="card center"><div class="eyebrow">Tsunami champion</div>${avatarHtml(rAv(r.champ),"lg")}<div class="who">🏄 ${esc(rName(r.champ))}</div>
      <p>rode the wave to ${(ROOM.scores||{})[r.champ] || 0} points.</p></div>
    ${notesHtml(r)}
    ${memeHtml(["Everyone else","after getting wiped out"], "🌊")}
    ${roomScores()}
    ${host ? `<button class="big" id="again">Play again</button>` : ""}
    ${roomFoot()}`;
  const ag = $("#again"); if (ag) ag.onclick = () => tsuStartOnline(true);
  bindFoot();
}

/* ================= boot ================= */
window.claude?.hot?.snapshot?.(() => ({S}));
const start = () => { render(); initStore(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>
