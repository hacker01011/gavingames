<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Glitch Game Night</title></head><body>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Lilita+One&family=Figtree:wght@400;600;700&display=swap">
<style>
/* Layout: one phone-sized column shared by a hub, two pass-and-play games and an account area. Lizard = leaf green, Tsunami = sea blue. */
:root{
  --bg:#eef2f5; --surface:#ffffff; --ink:#14212b; --muted:#566673; --line:#d2dce3;
  --accent:#ff7a1a; --accent-ink:#1a0d00;
  --leaf:#2f8a3e; --leaf-ink:#ffffff; --sea:#0e7fa6; --sea-ink:#ffffff; --grape:#8e4ec6; --grape-ink:#ffffff;
  --foam:#bfe9f5; --b4:#0b6e8f; --b3:#3aa5c7; --b2:#9ad6e8;
  --gold:#b7791f; --ok:#15803d; --bad:#c2410c; --rare-bg:#fff1e6;
  --display:"Lilita One", "Arial Rounded MT Bold", system-ui, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --meme:"Anton", Impact, "Arial Narrow Bold", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1218; --surface:#141f28; --ink:#e6eef3; --muted:#93a6b3; --line:#26343f;
  --accent:#ff9447; --accent-ink:#1a0d00;
  --leaf:#5cc96b; --leaf-ink:#0b170c; --sea:#38b6dc; --sea-ink:#04131a; --grape:#c39af0; --grape-ink:#1b0b2c;
  --foam:#123a4a; --b4:#5fd0f0; --b3:#2f97b8; --b2:#1d5f75;
  --gold:#f6c453; --ok:#4ade80; --bad:#fdba74; --rare-bg:#2a1608; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1218; --surface:#141f28; --ink:#e6eef3; --muted:#93a6b3; --line:#26343f;
  --accent:#ff9447; --accent-ink:#1a0d00;
  --leaf:#5cc96b; --leaf-ink:#0b170c; --sea:#38b6dc; --sea-ink:#04131a; --grape:#c39af0; --grape-ink:#1b0b2c;
  --foam:#123a4a; --b4:#5fd0f0; --b3:#2f97b8; --b2:#1d5f75;
  --gold:#f6c453; --ok:#4ade80; --bad:#fdba74; --rare-bg:#2a1608; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px}
.stage{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.stage.lizard{--main:var(--leaf);--main-ink:var(--leaf-ink)}
.stage.tsunami{--main:var(--sea);--main-ink:var(--sea-ink)}
.stage.dash{--main:var(--grape);--main-ink:var(--grape-ink)}
.stage{--main:var(--accent);--main-ink:var(--accent-ink)}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.05;text-wrap:balance;margin:0}
h1{font-size:2.5rem}
h2{font-size:1.7rem}
h3{font-size:1.25rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.small-print{font-size:.88rem;color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.center{text-align:center;align-items:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
label{font-weight:600;font-size:.9rem}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0}
button{font:700 1rem var(--body);border:0;border-radius:14px;padding:14px 18px;cursor:pointer;background:var(--main);color:var(--main-ink)}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.small{padding:8px 12px;font-size:.9rem;border-radius:10px}
button.big{width:100%;font-size:1.15rem;padding:18px}
button.power{background:var(--rare-bg);color:var(--ink);border:2px solid var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--main);outline-offset:2px}
.who{font:400 2.4rem var(--display)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{flex:1;min-width:0}
.tabs button[aria-pressed="false"]{background:transparent;color:var(--ink);border:1px solid var(--line)}

/* hub */
.gamecard{display:flex;gap:14px;align-items:center;text-align:left;width:100%;padding:18px;border-radius:18px}
.gamecard .ic{font-size:2.6rem;line-height:1}
.gamecard b{font:400 1.5rem var(--display);display:block}
.gamecard span{font-weight:400;font-size:.9rem}
.gc-liz{background:var(--leaf);color:var(--leaf-ink)}
.gc-tsu{background:var(--sea);color:var(--sea-ink)}
.gc-dash{background:var(--grape);color:var(--grape-ink)}
/* doodle dash */
.dcv{width:100%;aspect-ratio:4/3;height:auto;background:#fff;border:2px solid var(--line);border-radius:14px;touch-action:none;cursor:crosshair;display:block}
.dcv.view{cursor:default}
.dhead{display:flex;justify-content:space-between;align-items:center;gap:12px}
.dhead>span:first-child{display:flex;flex-direction:column;min-width:0}
.dmask{font:400 1.5rem var(--display);letter-spacing:.06em;white-space:pre-wrap;word-break:break-word}
.dtime{font:400 2rem var(--display);font-variant-numeric:tabular-nums;min-width:2.4em;text-align:center;padding:4px 10px;border-radius:12px;background:var(--main);color:var(--main-ink)}
.dtime.low{background:var(--bad);color:#fff}
.dtools{display:flex;flex-wrap:wrap;gap:6px}
.dsw{width:36px;height:36px;padding:0;border-radius:50%;background:var(--sw);border:2px solid var(--line);font-size:1rem}
.dsw[aria-pressed="true"]{outline:3px solid var(--main);outline-offset:2px}
.dsz[aria-pressed="false"]{background:transparent;color:var(--ink);border:1px solid var(--line)}
.dpick{display:flex;flex-direction:column;gap:10px;width:100%}
.dchat{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;font-size:.92rem}
.dchat .ok{color:var(--ok);font-weight:700}

/* avatars */
.av{--s:44px;position:relative;width:var(--s);height:var(--s);border-radius:50%;background:var(--avbg,#888);display:inline-grid;place-items:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.av .f{font-size:calc(var(--s)*.58);line-height:1}
.av .h{position:absolute;top:calc(var(--s)*-.30);left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.42);line-height:1}
.av .b{position:absolute;right:calc(var(--s)*-.12);top:calc(var(--s)*.02);font-size:calc(var(--s)*.32);line-height:1}
.av .o{position:absolute;bottom:calc(var(--s)*-.26);left:50%;transform:translateX(-50%);font-size:calc(var(--s)*.44);line-height:1}
.av .sk{position:absolute;inset:0;border-radius:50%;overflow:hidden;display:block}
.av .sk svg{width:100%;height:100%;display:block}
.sksw{width:40px;height:40px;border-radius:9px;overflow:hidden;display:inline-grid;background:var(--bg);flex:none}
.sksw svg{width:100%;height:100%;display:block}
.pcell .sksw{width:48px;height:48px}
.item .sksw{width:32px;height:32px}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.sitem{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px 12px;border-radius:16px;color:#fff;text-align:center;
  background:linear-gradient(160deg,var(--rc),color-mix(in srgb,var(--rc) 45%,#000));border:2px solid transparent;min-width:0}
.sitem .e{font-size:2.6rem;line-height:1.1}
.sitem .chipc{width:44px;height:44px;border-radius:50%;border:2px solid rgba(255,255,255,.6)}
.sitem small{font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;opacity:.85}
.sitem .price{background:rgba(0,0,0,.35);border-radius:999px;padding:2px 10px;font-weight:700}
.sitem.owned{opacity:.55}
.sitem[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 3px var(--rc)}
.rewardrow{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.rewardrow .lv{font:400 1.1rem var(--display);width:3.2em;flex:none}
.rewardrow.locked{opacity:.5}
.mini{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:12px}
.mini .log{font-size:.88rem}
.av.lg{--s:96px}
.av.md{--s:60px}
.av.sm{--s:32px}
.player{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.player .nm{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:.75rem;font-weight:700;border-radius:999px;padding:2px 8px;border:1px solid var(--line);color:var(--muted)}
.acct-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
.acct-grid button{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--bg);color:var(--ink);border:1px solid var(--line);padding:16px 8px 10px}
.acct-grid button small{font-weight:400;color:var(--muted)}

/* color login */
.swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{aspect-ratio:1/1;border-radius:14px;border:2px solid var(--line);padding:0;display:flex;align-items:flex-end;justify-content:center;font-size:.7rem;font-weight:700;padding-bottom:4px;max-width:100%}
.qbig{font:400 1.9rem var(--display);text-align:center}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--main)}
.pad{display:grid;grid-template-columns:repeat(3,64px);gap:10px;justify-content:center}
.pad button{height:56px;font:400 1.5rem var(--display);padding:0}
.progress{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--main)}

/* economy */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:var(--bg);border-radius:12px;padding:10px 4px}
.stats b{display:block;font:400 1.5rem var(--display);font-variant-numeric:tabular-nums}
.gb{color:var(--gold);font-weight:700}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.item{display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 4px;font-size:.78rem;font-weight:600;text-align:center}
.item .e{font-size:1.8rem;line-height:1.1}
.item .chipc{width:28px;height:28px;border-radius:50%}
.item[aria-pressed="true"]{border-color:var(--accent)}
.packs4{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pack{display:flex;flex-direction:column;gap:4px;align-items:flex-start;text-align:left;padding:14px;border-radius:14px;color:#fff}
.pack b{font:400 1.2rem var(--display)}
.pack span{font-weight:400;font-size:.8rem;opacity:.9}
.pk-pirate{background:linear-gradient(140deg,#c0392b,#1f4e79)}
.pk-idol{background:linear-gradient(140deg,#d63384,#3b1d6e)}
.pk-cursed{background:linear-gradient(140deg,#3d1a6e,#0d0d14)}
.pk-glitch{background:linear-gradient(140deg,#118a4e,#0b2a3a)}
.pk-brainrot{background:linear-gradient(140deg,#7c3aed,#db2777)}
.pk-roger{background:linear-gradient(140deg,#b45309,#3f2a14)}
.pk-space{background:linear-gradient(140deg,#1e3a8a,#0b1020)}
.pk-snack{background:linear-gradient(140deg,#ef4444,#f59e0b)}
.pk-sports{background:linear-gradient(140deg,#15803d,#1e3a8a)}
.pk-spooky{background:linear-gradient(140deg,#4c1d95,#111)}
.paywrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.paysheet{--main:var(--accent);--main-ink:var(--accent-ink);background:var(--surface);color:var(--ink);width:100%;max-width:440px;border-radius:20px 20px 0 0;padding:18px 18px 24px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -10px 40px rgba(0,0,0,.3)}
@media(min-width:600px){.paywrap{align-items:center}.paysheet{border-radius:20px}}
.payitem{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--rare-bg)}
.payitem div{flex:1;display:flex;flex-direction:column}.payitem small{opacity:.7}
.payicon{font-size:2rem;line-height:1}
.payrow{display:flex;justify-content:space-between;font-size:.9rem;padding:4px 2px;border-bottom:1px solid var(--line)}
.payrow.total{font-weight:700;font-size:1.05rem;border-bottom:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.gbuxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px}
.gbux{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:16px 8px 12px;border-radius:14px;background:linear-gradient(160deg,#1e3a8a,#7c3aed);color:#fff}
.gbux b{font-size:1.3rem}.gbux small{opacity:.8}
.gbux .price{margin-top:6px;background:#fff;color:#1e3a8a;border-radius:999px;padding:3px 12px;font-weight:700}
.giftcard{display:flex;flex-direction:column;gap:2px;padding:18px;border-radius:16px;color:#fff;background:linear-gradient(135deg,#7c3aed,#db2777 60%,#f59e0b);aspect-ratio:1.7/1;justify-content:flex-end;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.giftcard b{font-size:1.3rem}.giftcard small{opacity:.85}.giftcard span{font-family:monospace;letter-spacing:.15em;opacity:.8}
.paysteps{display:flex;gap:4px}.paysteps span{flex:1;text-align:center;font-size:.7rem;padding-top:6px;border-top:3px solid var(--line);opacity:.6}
.paysteps span.on{border-color:var(--accent);opacity:1;font-weight:700}
.paymethods{display:grid;gap:8px}
.paymethod{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:10px;text-align:left;background:var(--bg);color:var(--ink);border:2px solid var(--line);padding:12px}
.paymethod span{grid-row:1/3;font-size:1.6rem;align-self:center}.paymethod small{opacity:.7;font-weight:400}
.paymethod[aria-pressed="true"]{border-color:var(--accent)}
.agree{display:flex;gap:8px;align-items:center;font-size:.9rem;margin:4px 0}
.agree input{width:20px;height:20px}
.hold{position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.hold i{position:absolute;inset:0;width:0;background:rgba(255,255,255,.35);transition:width 0s}
.hold.on i{width:100%;transition:width 2s linear}
.hold span{position:relative}
.receipt{border:1px dashed var(--line);border-radius:12px;padding:10px 12px}
.nt{background:var(--nt);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;font-weight:800}
.nt.shine{background-size:200% auto;animation:ntshine 3s linear infinite}
@keyframes ntshine{to{background-position:200% center}}
@media (prefers-reduced-motion:reduce){.nt.shine{animation:none}}
.announce{padding:10px 14px;border-radius:12px;background:var(--rare-bg);border:1px solid var(--accent);font-weight:600}
.announce.sale{background:linear-gradient(90deg,#b91c1c,#f59e0b);color:#fff;border:0}
.tradebox{padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.gbux em{position:absolute;top:-8px;font-style:normal;font-size:.7rem;font-weight:700;background:#f59e0b;color:#111;border-radius:999px;padding:2px 8px;white-space:nowrap}
.toast{background:var(--rare-bg);border:2px solid var(--accent);border-radius:14px;padding:12px 14px;font-weight:600}

/* battle pass */
.passhero{background:linear-gradient(135deg,#7c3aed,#db2777,#f59e0b);color:#fff;border:0;border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:12px}
.passhero .eyebrow{color:#fff;opacity:.9}
.passhero h1{font-size:2rem}
.passhero small{opacity:.9;font-weight:700}
.pbar{height:14px;border-radius:999px;background:rgba(0,0,0,.28);overflow:hidden}
.pbar i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .4s}
.ptrack{display:flex;flex-direction:column;gap:8px}
.ptier{display:grid;grid-template-columns:46px 1fr 1fr;gap:8px;align-items:stretch;border:1px solid var(--line);border-radius:14px;padding:8px;background:var(--surface)}
.ptier.cur{border-color:var(--main);box-shadow:0 0 0 2px var(--main)}
.ptier .tnum{display:flex;flex-direction:column;align-items:center;justify-content:center;font:400 1.4rem var(--display);background:var(--bg);border-radius:10px;line-height:1}
.ptier .tnum small{font-size:.55rem;font-family:var(--body);color:var(--muted);letter-spacing:.1em}
.pcell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;border:2px solid var(--rc,var(--line));border-radius:10px;padding:8px 6px;min-height:84px}
.pcell small{font-size:.72rem;line-height:1.15}
.pcell.done{opacity:.5}
.pcell .e{font-size:1.7rem;line-height:1}
.pcell .chipc{width:30px;height:30px;border-radius:7px}
.pcell .nt{font-size:1.1rem}
.pcell button.small{padding:5px 12px}
.ptag{font-size:1.2rem}
.ptag.done{color:var(--ok)}
.ptracklabel{display:grid;grid-template-columns:46px 1fr 1fr;gap:8px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:2px 8px}
.ptracklabel span{text-align:center}
/* lizard */
.public{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--leaf);color:var(--leaf-ink);border-radius:14px;padding:12px 16px}
.public b{font:400 1.4rem var(--display)}
.public .eyebrow{color:inherit;opacity:.85}
.word{font:400 3rem var(--display);line-height:1;word-break:break-word}
.role{min-height:300px;justify-content:center;align-items:center;text-align:center}
.role.liz{animation:shift 4s linear infinite;border-color:transparent;color:#0b170c}
.role.liz .eyebrow{color:#0b170c}
@keyframes shift{0%{background:#7bd88f}25%{background:#f6d365}50%{background:#fda085}75%{background:#a18cd1}100%{background:#7bd88f}}
.hintbox{background:rgba(255,255,255,.6);border-radius:10px;padding:8px 12px;color:#0b170c}
.order{display:flex;flex-wrap:wrap;gap:6px}
.order span{border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-weight:600;font-size:.9rem}
.order span:first-child{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}

/* tsunami meter */
.ends{display:flex;justify-content:space-between;gap:12px;font:400 1.25rem var(--display)}
.ends span:last-child{text-align:right}
.meter{position:relative;height:64px;border-radius:14px;background:var(--foam);overflow:hidden;border:1px solid var(--line)}
.meter .water{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,transparent,var(--sea));opacity:.35;transition:width 1.6s cubic-bezier(.2,.8,.2,1)}
.meter .zone{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,transparent 0 6px,rgba(255,122,26,.35) 6px 12px)}
.band{position:absolute;top:0;bottom:0;transform:translateX(-50%)}
.band.b2{background:var(--b2)} .band.b3{background:var(--b3)} .band.b4{background:var(--b4)}
.band span{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font:700 .72rem var(--body);color:var(--sea-ink)}
.pin{position:absolute;top:-2px;bottom:-2px;width:4px;margin-left:-2px;background:var(--ink);border-radius:2px}
.pin b{position:absolute;top:2px;left:6px;font-size:.72rem;white-space:nowrap;background:var(--surface);color:var(--ink);padding:0 4px;border-radius:4px;border:1px solid var(--line)}
.pin.right b{left:auto;right:6px}
.ticks{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--sea);height:36px}
.readout{font:400 1.4rem var(--display);font-variant-numeric:tabular-nums;text-align:center}
.rare{background:var(--rare-bg);border:2px solid var(--bad);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;animation:pop .5s ease-out}
.rare .eyebrow{color:var(--bad)}
.rare b{font:400 1.5rem var(--display);color:var(--bad)}
@keyframes pop{0%{transform:scale(.9);opacity:.4}60%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
.packs{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;font-weight:600;font-size:.92rem;min-width:0}
.chip input{width:20px;height:20px;accent-color:var(--sea);flex:none}
.chip small{display:block;font-weight:400;color:var(--muted);font-size:.75rem}

/* shared bits */
.ring{position:relative;width:84px;height:84px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font:400 1.7rem var(--display);font-variant-numeric:tabular-nums}
.log{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.log>div{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px dashed var(--line);padding-bottom:6px}
.log b{font-variant-numeric:tabular-nums}
.plus{color:var(--ok);font-weight:700}
.minus{color:var(--bad);font-weight:700}
.meme{background:#000;border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1/1;width:100%;max-width:100%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:12px;color:#fff}
.meme .face{font-size:7rem;line-height:1}
.meme .t{font:400 1.6rem/1.05 var(--meme);text-transform:uppercase;text-align:center;text-shadow:2px 2px 0 #000,-2px 2px 0 #000,2px -2px 0 #000,-2px -2px 0 #000}
.scare{position:fixed;inset:0;z-index:50;background:#000;display:grid;place-items:center;color:#fff;text-align:center;cursor:pointer;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.scare .boo{font-size:min(60vw,320px);line-height:1;animation:boo .6s cubic-bezier(.2,2,.4,1) both, shake .12s linear .6s 6}
.scare p{font:400 1.6rem var(--meme);letter-spacing:.04em}
@keyframes boo{from{transform:scale(.1) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
@keyframes shake{0%{transform:translate(8px,-6px)}50%{transform:translate(-8px,6px)}100%{transform:translate(0,0)}}
.status{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion: reduce){.meter .water{transition:none}.rare,.role.liz,.scare .boo{animation:none}.role.liz{background:#f6d365}}

        <h3>Next: your color key</h3>
        <p class="small-print">Instead of a password, you pick a color for each question. To log in later, you get 3 random ones and have to match what you picked. Go with your gut so you remember! You can also add a PIN after, and switch modes later in your account.</p>
        <div class="tabs">
          <button class="small" data-mode="simple" aria-pressed="${(c.mode||"simple")==="simple"}">Simplified · ${QKEYS.length} questions</button>
          <button class="small" data-mode="full" aria-pressed="${c.mode==="full"}">Full · ${FULL_KEYS.length} questions</button>
        </div>
        <p class="small-print">${c.mode==="full" ? "Math, Science, English, History, Art, Music, Gym, the numbers 1 to 9, the four seasons and all 12 months." : "Math, Science, English, History, the numbers 1 to 3 and the four seasons."}</p>

    $("#next").onclick = () => { c.mode = c.mode || "simple"; c.keys = c.mode === "full" ? FULL_KEYS : QKEYS; c.step = "colors"; c.qi = 0; render(); };

    const K = c.keys || QKEYS, k = K[c.qi];
    app.innerHTML = `

      <div class="spread"><span class="eyebrow">${esc(qGroup(k))} · ${c.qi+1} of ${K.length}</span>
        <span class="row">${c.qi ? `<button class="ghost small" id="undo">Back one</button>` : ""}<button class="ghost small" id="cancel">Cancel</button></span></div>

    });

    $("#skip").onclick = () => c.pinOnly ? go("profile", {profile:{id:c.redo, tab:"avatar"}}) : finishCreate(null);
    const rm = $("#rmpin"); if (rm) rm.onclick = () => { const a = DATA.accounts[c.redo]; a.pin = null; saveAccount(a); S.toasts = ["PIN removed. Log in with your colors."]; go("profile", {profile:{id:a.id, tab:"avatar"}}); };

function finishCreate(pin){
  const c = S.create;
  if (c.redo){
    const a = DATA.accounts[c.redo];
    if (!c.pinOnly){ a.colors = c.colors; a.keyVersion = KEY_VERSION; a.keyMode = c.mode || a.keyMode || "simple"; }
    if (pin) a.pin = pin;
    saveAccount(a);
    if (!S.verified.includes(a.id)) S.verified.push(a.id);
    S.toasts = [c.pinOnly ? "PIN saved." : c.upgrade ? "Full mode is on. Logins can ask any of your " + FULL_KEYS.length + " questions." : "Color key saved!" + (pin ? " PIN saved too." : "")];
    afterLogin(a, c.next || {view:"profile"});
    return;
  }
  const a = newAccount(c.name, c.face, c.bg, c.colors, pin);
  a.keyMode = c.mode || "simple";
  saveAccount(a);
  S.verified.push(a.id);
  S.toasts = [`Welcome ${a.name}! You start with ${GB.start} Gbucks, one of each power-up and a free pack.`];
  if (c.then === "pickAccount"){ addPlayer({acct:a.id}); go("lobby"); }
  else go("profile", {profile:{id:a.id, tab:"packs"}});
}
function padHtml(val){
  return `<div class="dots" style="gap:12px">${[0,1,2,3].map(j => `<i class="${j<val.length?"on":""}" style="width:16px;height:16px"></i>`).join("")}</div>
    <div class="pad">${["1","2","3","4","5","6","7","8","9","","0","⌫"].map(k => k ? `<button class="ghost" data-k="${k}" aria-label="${k==="⌫"?"Delete":k}">${k}</button>` : `<span></span>`).join("")}</div>`;
}
function bindPad(app, get, set){
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k, v = get();
    if (k === "⌫") set(v.slice(0,-1)); else if (v.length < 4) set(v + k);
  });
}

/* ================= color login ================= */
function startQuiz(id, then){
  const a = DATA.accounts[id];
  // old accounts are checked once with their old questions, then have to redo the key
  const pool = a && a.keyVersion === KEY_VERSION ? keysFor(a) : Object.keys((a && a.colors) || {});
  S.quiz = {id, pool, qs:shuffle(pool).slice(0,3), i:0, ans:[], then, fails:0, mode:"colors", pin:"", pinFails:0};
  go("quiz");
}
function afterLogin(a, then){
  if (!S.verified.includes(a.id)) S.verified.push(a.id);
  if (a.keyVersion !== KEY_VERSION){
    S.verified = S.verified.filter(x => x !== a.id); // not fully logged in until the new key is made
    go("create", {create:{step:"colors", redo:a.id, name:a.name, qi:0, colors:{}, then:"redo", next:then}});
    return;
  }
  if (then.view === "lobby"){ addPlayer({acct:a.id}); go("lobby"); }
  else if (then.view === "shop") go("shop", {shop:{id:a.id, sel:null}});
  else if (then.view === "pass") go("pass", {pass:{id:a.id}});
  else if (then.view === "online"){ const o = O(); o.acct = a.id; o.guest = null; o.step = "menu"; go("online"); }
  else go("profile", {profile:{id:a.id, tab:"avatar"}});
}
function renderQuiz(app){
  const q = S.quiz, a = DATA.accounts[q.id];
  if (!a){ go("home"); return; }
  if (a.frozen){
    app.innerHTML = `<div class="card center"><div style="font-size:3rem">🧊</div><h2>${esc(a.name)} is frozen</h2>
      <p class="small-print">This account can't be used right now. Talk to Gavin.</p><button class="big" id="back">Back</button></div>`;
    $("#back").onclick = () => go("home"); return;
  }
  const head = `<div class="spread"><span class="row">${avatarHtml(a.avatar,"sm")}<b>${esc(a.name)}</b></span><button class="ghost small" id="back">Cancel</button></div>`;
  if (q.mode === "pin"){
    app.innerHTML = head + `
      <div class="card center">
        <div class="eyebrow">PIN login</div><h2>Type your PIN</h2>
        ${padHtml(q.pin)}
        ${q.pinFails ? `<p class="minus">Wrong PIN. Try again.</p>` : `<p class="small-print">Everyone else look away.</p>`}
        <button class="ghost small" id="mode">Use my colors instead</button>
      </div>`;
    bindPad(app, () => q.pin, v => { q.pin = v;
      if (v.length < 4){ render(); return; }
      if (v === a.pin){ afterLogin(a, q.then); return; }
      q.pinFails++; q.pin = ""; render();
    });
    $("#mode").onclick = () => { q.mode = "colors"; render(); };
  } else {
    const k = q.qs[q.i];
    app.innerHTML = head + `
      ${a.keyVersion !== KEY_VERSION ? `<div class="toast">The color questions changed! Answer 3 of your old ones one last time, then you'll pick colors for the new ones.</div>` : ""}
      <div class="card center">
        <div class="eyebrow">Color check · question ${q.i+1} of 3</div>
        <div class="dots">${[0,1,2].map(j => `<i class="${j<q.i?"on":""}"></i>`).join("")}</div>
        <div class="qbig">${esc(qText(k))}</div>
        <div class="swatches" style="width:100%">${COLORS.map(([n,h]) => `<button class="sw" data-c="${n}" style="background:${h};color:${["yellow","white"].includes(n)?"#111":"#fff"}" aria-label="${n}">${n}</button>`).join("")}</div>
        ${q.fails ? `<p class="minus">Nope, that didn't match. Here are 3 new ones.</p>` : `<p class="small-print">Everyone else look away.</p>`}
        ${a.pin ? `<button class="ghost small" id="mode">Log in with my PIN instead</button>` : ""}
      </div>`;
    app.querySelectorAll("[data-c]").forEach(b => b.onclick = () => {
      q.ans.push(b.dataset.c);
      if (q.i < 2){ q.i++; render(); return; }
      const ok = q.qs.every((key, j) => a.colors[key] === q.ans[j]);
      if (!ok){ q.fails++; q.qs = shuffle(q.pool).slice(0,3); q.i = 0; q.ans = []; render(); return; }
      afterLogin(a, q.then);
    });
    const m = $("#mode"); if (m) m.onclick = () => { q.mode = "pin"; q.pin = ""; render(); };
  }
  $("#back").onclick = () => go(q.then.view === "lobby" ? "pickAccount" : q.then.view === "online" ? "online" : "home");
}

/* gift cards: Gavin makes codes on admin.html (stored at giftcards/{CODE}); each one works once */
const normGift = t => { const c = String(t).toUpperCase().replace(/[^A-Z0-9]/g, ""); return c.length === 8 ? c.slice(0,4) + "-" + c.slice(4) : null; };
function redeemGift(a, raw){
  const code = normGift(raw);
  if (!code) return Promise.resolve({msg:"Gift card codes look like ABCD-EFGH."});
  if (!fdb) return Promise.resolve({msg:"Gift cards only work when the game is online."});
  // mark it used inside a transaction so the same card can never be spent twice
  return ref("giftcards/" + code).transaction(cur => {
    if (cur === null) return null;   // not loaded yet or doesn't exist; the server decides
    if (cur.used) return;            // already spent: abort
    if (cur.expires && cur.expires < Date.now()) return;   // expired: abort
    return {...cur, used:a.id, usedBy:a.name, usedAt:Date.now()};
  }).then(({committed, snapshot}) => {
    const v = snapshot.val();
    if (!v) return {msg:"That gift card code doesn't exist."};
    if (!v.used && v.expires && v.expires < Date.now()) return {msg:"That gift card expired on " + new Date(v.expires).toLocaleDateString() + "."};
    if (!committed || v.used !== a.id) return {msg:"That gift card was already redeemed."};
    a.gbucks += v.amount; saveAccount(a);
    return {ok:true, amount:v.amount};
  }).catch(() => ({msg:"Something went wrong. Try again."}));
}

// Items you can give away or trade: shop and pack items. Free starters, level rewards and achievement items stay put.
const giftable = id => { const i = ITEMS[id]; return !!i && !i.free && !i.level && !i.ach; };
const SLOT_DEFAULT = {face:"f-frog", bg:"bg-sky"};
function dropItem(acc, id){
  const k = acc.items.indexOf(id); if (k < 0) return false;
  acc.items.splice(k, 1);
  const t = ITEMS[id].type; if (acc.avatar[t] === id) acc.avatar[t] = SLOT_DEFAULT[t] || null;
  return true;
}
// Changes one account in place on the server so it never overwrites someone else's newer save.
// fn returns false to cancel. Resolves with the saved account, or null if it was canceled.
function changeAccount(id, fn){
  if (!fdb){
    const x = DATA.accounts[id]; if (!x) return Promise.resolve(null);
    const copy = JSON.parse(JSON.stringify(x)); fixAccount(copy);
    if (fn(copy) === false) return Promise.resolve(null);
    DATA.accounts[id] = copy; saveLocal(); return Promise.resolve(copy);
  }
  return ref("accounts/" + id).transaction(cur => {
    if (cur === null) return null;            // not loaded yet; the server retries with the real value
    fixAccount(cur);
    if (fn(cur) === false) return;            // cancel
    return clean(cur);
  }).then(r => {
    if (!r.committed || !r.snapshot.exists()) return null;
    const v = fixAccount(r.snapshot.val()); DATA.accounts[id] = v; return v;
  });
}
const pushLog = (acc, text) => { acc.inbox = (acc.inbox || []).concat({text, at:Date.now()}).slice(-8); };

async function sendGift(a, toId, kind, value){
  const to = DATA.accounts[toId]; if (!to) return "Pick who to send it to.";
  if (kind === "gbux"){
    const amt = Math.floor(value);
    if (!(amt > 0)) return "Type how many Gbux to send.";
    const me = await changeAccount(a.id, x => { if (x.gbucks < amt) return false; x.gbucks -= amt; stat(x, "gifts"); });
    if (!me) return "You don't have that many Gbux.";
    const them = await changeAccount(toId, x => { x.gbucks += amt; pushLog(x, `🎁 ${a.name} sent you ${fmt(amt)} Gbux`); });
    if (!them){ await changeAccount(a.id, x => { x.gbucks += amt; }); return "That didn't go through. Your Gbux were given back."; }
    saveAccount(me);   // runs the achievement check on the sender
    return {ok:`Sent ${fmt(amt)} Gbux to ${to.name}!`};
  }
  const id = value;
  if (!giftable(id)) return "Pick an item to send.";
  if (to.items.includes(id)) return `${to.name} already has that.`;
  const me = await changeAccount(a.id, x => { if (!dropItem(x, id)) return false; stat(x, "gifts"); });
  if (!me) return "You don't have that item anymore.";
  const them = await changeAccount(toId, x => { if (x.items.includes(id)) return false; x.items.push(id); pushLog(x, `🎁 ${a.name} sent you ${ITEMS[id].name}`); });
  if (!them){ await changeAccount(a.id, x => { if (!x.items.includes(id)) x.items.push(id); }); return `${to.name} already has that. You kept it.`; }
  saveAccount(me);
  return {ok:`Sent ${ITEMS[id].name} to ${to.name}!`};
}

// trades live at trades/{id}: {from, to, give:[my items], want:[their items], status:"pending"|"done"|"declined"|"canceled"|"failed"}
function offerTrade(a, toId, give, want){
  if (!fdb) return Promise.resolve("Trading needs the game to be online.");
  if (!toId) return Promise.resolve("Pick who to trade with.");
  if (!give.length || !want.length) return Promise.resolve("Pick at least one item on each side.");
  const t = {from:a.id, fromName:a.name, to:toId, toName:DATA.accounts[toId].name, give, want, at:Date.now(), status:"pending"};
  return ref("trades").push(t).then(() => ({ok:"Trade offer sent!"}));
}
const setTrade = (tid, status) => ref(`trades/${tid}/status`).set(status);
async function acceptTrade(a, tid){
  const tr = DATA.trades[tid];
  if (!tr || tr.to !== a.id) return "That trade is gone.";
  // claim the trade first so it can only be accepted once
  const claim = await ref(`trades/${tid}`).transaction(t => { if (t === null) return null; if (t.status !== "pending") return; return {...t, status:"working"}; });
  if (!claim.committed || !claim.snapshot.exists()) return "That trade was already handled.";
  const t = claim.snapshot.val(), give = t.give || [], want = t.want || [];
  const them = await changeAccount(t.from, x => {
    if (!give.every(id => x.items.includes(id)) || want.some(id => x.items.includes(id))) return false;
    give.forEach(id => dropItem(x, id)); want.forEach(id => x.items.push(id)); stat(x, "trades");
    pushLog(x, `🤝 ${a.name} accepted your trade`);
  });
  if (!them){ await setTrade(tid, "failed"); return `${t.fromName} doesn't have those items anymore, so the trade was canceled.`; }
  const me = await changeAccount(a.id, x => {
    if (!want.every(id => x.items.includes(id)) || give.some(id => x.items.includes(id))) return false;
    want.forEach(id => dropItem(x, id)); give.forEach(id => x.items.push(id)); stat(x, "trades");
  });
  if (!me){
    // undo the other side
    await changeAccount(t.from, x => { want.forEach(id => dropItem(x, id)); give.forEach(id => { if (!x.items.includes(id)) x.items.push(id); }); x.stats.trades = Math.max(0, (x.stats.trades||1) - 1); });
    await setTrade(tid, "failed"); return "You don't have those items anymore, so the trade was canceled.";
  }
  await setTrade(tid, "done");
  saveAccount(me);
  return {ok:"Trade complete! 🤝"};
}

function seeded(seed){
  let h = 2166136261; for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => { h += 0x6D2B79F5; let t = h; t = Math.imul(t ^ t >>> 15, t | 1); t ^= t + Math.imul(t ^ t >>> 7, t | 61); return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
// the shop resets every Monday at midnight
function weekStart(){ const d = new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay()+6)%7); return d; }
function shopFeatured(){
  const w = weekStart(), rnd = seeded("shop-week-" + w.getFullYear()+"-"+(w.getMonth()+1)+"-"+w.getDate());
  const take = (list, n) => { const a = list.slice(), out = []; while (out.length < n && a.length) out.push(a.splice(Math.floor(rnd()*a.length), 1)[0][0]); return out; };
  return [...take(SHOP.legendary,2), ...take(SHOP.epic,4)];
}
const shopAlways = () => [...SHOP.rare, ...SHOP.common].map(x => x[0]);
function untilReset(){ const m = weekStart(); m.setDate(m.getDate()+7); const mins = Math.ceil((m-new Date())/60000), d = Math.floor(mins/1440), h = Math.floor(mins%1440/60);
  return d ? `${d}d ${h}h` : `${h}h ${mins%60}m`; }

          : `<div class="row"><button class="small" data-o="team">Team caught it</button><button class="small" data-o="steal">Caught, but lizard guessed the word</button><button class="small" data-o="lizard">Lizard escaped</button></div>`}
      </div>
      ${rewardLines(r.notes)}

      <button class="big" id="again" ${r.outcome?"":"disabled"}>Next round</button>
      <button class="ghost" id="lobby">Back to the lobby</button>`;
    app.querySelectorAll("[data-o]").forEach(b => b.onclick = () => {
      if (r.outcome) return;

      for (let k=0;k<n;k++){
        const isLiz = r.liz.includes(k);
        const p = r.outcome==="team" ? (isLiz?0:1) : r.outcome==="steal" ? (isLiz?1:0) : (isLiz?3:0);
        G.scores[k] = (G.scores[k]||0) + p;
        const pl = P[k];
        if (pl.acct && DATA.accounts[pl.acct]){

          stat(a, "games"); if (isLiz && r.outcome !== "team" && r.outcome !== "steal") stat(a, "escapes"); if (!isLiz && r.outcome === "team") stat(a, "catches");
          if (p > 0){ a.wins.lizard++; addDaily("lizard", pl.acct, p); }
          r.notes.push(`${a.name}: +${p > 0 ? 25 : 10} XP`);
          r.notes.push(...reward(pl.acct, {xp: p > 0 ? 25 : 10}));

      }
      render();

function tsuNewRound(){
  const l = S.lobby.tsunami, G = S.tsu, n = l.players.length;
  const chance = {off:0, rare:1/6, chaos:1/2}[l.rare];
  const mode = Math.random() < chance ? pick(MODES) : null;
  const scale = mode && mode.id === "whirlpool" ? [pick(tpool())[0], pick(tpool())[1]] : pick(tpool());
  G.giver = G.giver % n;
  const guessers = [...Array(n).keys()].filter(i => i !== G.giver);
  G.r = { scale, target:rint(3,97), mode, guessers, gi:0, pins:{}, radio:{}, phase:"pass", meme:pick(TSU_MEMES), scored:false, scareSet:null, scareBy:null, notes:[] };
  G.round++;

}

function tsuScore(){
  const l = S.lobby.tsunami, P = l.players, n = P.length, G = S.tsu, r = G.r, m = r.mode;
  const k = (m && m.band) || 1, mult = (m && m.mult) || 1, nm = i => playerName(P[i]);
  const add = (i, v) => { G.scores[i] = Math.max(0, (G.scores[i]||0) + v); };
  const leaderBefore = [...Array(n).keys()].sort((a,b) => (G.scores[b]||0) - (G.scores[a]||0))[0];
  const gained = {};
  r.res = r.guessers.map(i => ({i, pin:r.pins[i], d:Math.abs(r.pins[i]-r.target)})).map(x => ({...x, p:tpts(x.d,k)*mult}));
  r.lines = [];
  const best = Math.min(...r.res.map(x => x.d));
  r.allMiss = r.res.every(x => x.p === 0);
  const winners = [];
  r.res.forEach(x => {
    const scores = l.scoring === "wta" ? (x.d === best && x.p > 0) : x.p > 0;
    if (scores){ add(x.i, x.p); gained[x.i] = (gained[x.i]||0) + x.p; winners.push(x.i); r.lines.push([nm(x.i), `+${x.p}${l.scoring==="wta"?" (closest)":""}`, "plus"]); }
    else r.lines.push([nm(x.i), x.p ? `${x.d} away, beaten` : "wiped out 🌊"]);
  });
  const g = G.giver;
  if (r.allMiss){ add(g, -1); r.lines.push([nm(g) + " (clue-giver)", "−1, nobody landed it", "minus"]); }
  else if (l.scoring === "all"){ const avg = Math.round(r.res.reduce((a,x) => a+x.p, 0) / r.res.length); add(g, avg); gained[g] = (gained[g]||0) + avg; r.lines.push([nm(g) + " (clue-giver)", "+" + avg, "plus"]); }
  else r.lines.push([nm(g) + " (clue-giver)", "safe"]);
  if (m && m.id === "shark" && winners.length){
    const thief = winners[0];
    if (leaderBefore !== thief && (G.scores[leaderBefore]||0) > 0){
      const take = Math.min(2, G.scores[leaderBefore]);
      add(leaderBefore, -take); add(thief, take); gained[thief] = (gained[thief]||0) + take;
      r.lines.push(["🦈 Shark Bite", `${nm(thief)} steals ${take} from ${nm(leaderBefore)}`, "minus"]);
    }
  }
  // account rewards: everyone with an account gets play XP, scorers get Gbucks + daily points
  for (let i=0;i<n;i++){
    const pl = P[i]; if (!pl.acct || !DATA.accounts[pl.acct]) continue;
    const p = gained[i] || 0;
    stat(DATA.accounts[pl.acct], "games"); if (p >= 4) stat(DATA.accounts[pl.acct], "splash");
    r.notes.push(`${DATA.accounts[pl.acct].name}: +${10+p*2} XP`);
    r.notes.push(...reward(pl.acct, {xp: 10 + p*2}));
    if (p) addDaily("tsunami", pl.acct, p);
  }
  const top = [...Array(n).keys()].filter(i => (G.scores[i]||0) >= l.win).sort((a,b) => G.scores[b]-G.scores[a]);
  r.champ = top.length ? top[0] : null;
  if (r.champ !== null && P[r.champ].acct && DATA.accounts[P[r.champ].acct]){
    const a = DATA.accounts[P[r.champ].acct]; a.wins.tsunami++;
    r.champNotes = reward(a.id, {xp:50, gb:GB.champ});
  }
  r.scored = true;
}

const DEVICE = (() => { const make = () => "d" + Math.random().toString(36).slice(2,10);
  try { let d = localStorage.getItem("ggn-device"); if (!d){ d = make(); localStorage.setItem("ggn-device", d); } return d; } catch(e){ return make(); } })();
let ROOM = null, roomOff = null;
const O = () => S.online || (S.online = {step:"who"});
const roomRef = (path="") => ref("rooms/" + O().code + (path ? "/" + path : ""));
const lastRewarded = () => { try { return localStorage.getItem("ggn-rewarded"); } catch(e){ return O().rewarded; } };
const markRewarded = id => { O().rewarded = String(id); try { localStorage.setItem("ggn-rewarded", String(id)); } catch(e){} };

function onlineMe(){ const o = O(); return o.acct && DATA.accounts[o.acct] ? {name:DATA.accounts[o.acct].name, acct:o.acct} : {name:o.guest || "Guest", acct:null}; }
const rPlayers = () => ROOM && ROOM.players ? Object.entries(ROOM.players).sort((a,b) => a[1].order - b[1].order).map(([dev,p]) => ({dev, ...p})) : [];
const rName = dev => { const p = ROOM && ROOM.players && ROOM.players[dev]; if (!p) return "Someone"; return p.acct && DATA.accounts[p.acct] ? DATA.accounts[p.acct].name : p.name; };
const rAv = dev => { const p = ROOM && ROOM.players && ROOM.players[dev]; return p && p.acct && DATA.accounts[p.acct] ? DATA.accounts[p.acct].avatar : guestAv; };
const isHost = () => ROOM && ROOM.host === DEVICE;
const makeCode = () => { const L = "ABCDEFGHJKLMNPQRSTUVWXYZ"; return Array.from({length:4}, () => L[Math.floor(Math.random()*L.length)]).join(""); };

async function hostRoom(game){
  const o = O();
  if (!fdb){ o.err = "Online rooms need an internet connection."; render(); return; }
  // tidy up rooms nobody has used for a day
  ref("rooms").orderByChild("created").endAt(Date.now() - 864e5).once("value", s => s.forEach(c => { c.ref.remove(); }));
  let code;
  for (let t = 0; t < 6; t++){ code = makeCode(); if (!(await ref("rooms/" + code).get()).exists()) break; }
  const l = S.lobby[game];
  const settings = game === "lizard" ? {cat:l.cat, lizards:l.lizards} : game === "dash" ? {cat:l.cat, time:l.time, rounds:l.rounds} : {packs:l.packs || Object.keys(TPACKS), rare:l.rare, scoring:l.scoring, win:l.win};
  await ref("rooms/" + code).set(clean({game, host:DEVICE, created:Date.now(), settings}));
  joinRoom(code);
}
async function joinRoom(code){
  const o = O(); code = (code || "").toUpperCase().trim();
  if (!fdb){ o.err = "Online rooms need an internet connection."; render(); return; }
  if (!/^[A-Z]{4}$/.test(code)){ o.err = "Room codes are 4 letters."; render(); return; }
  const snap = await ref("rooms/" + code).get();
  if (!snap.exists()){ o.err = `There's no room called ${code}. Check the code.`; render(); return; }
  const me = onlineMe();
  const pref = ref(`rooms/${code}/players/${DEVICE}`);
  await pref.set(clean({name:me.name, acct:me.acct, order:Date.now()}));
  pref.onDisconnect().remove();
  o.code = code; o.err = ""; o.step = "room";
  if (roomOff) roomOff();
  const rr = ref("rooms/" + code);
  const cb = rr.on("value", s => { ROOM = s.val(); onRoomChange(); });
  roomOff = () => rr.off("value", cb);
  go("online");
}
function leaveRoom(){
  const o = O();
  if (o.code) ref(`rooms/${o.code}/players/${DEVICE}`).remove();
  if (roomOff) roomOff();
  roomOff = null; ROOM = null; o.code = null; o.step = "menu"; go("online");
}
function onRoomChange(){
  const o = O();
  if (!ROOM || !ROOM.players || !ROOM.players[DEVICE]){
    if (o.step === "room"){ if (roomOff) roomOff(); roomOff = null; ROOM = null; o.code = null; o.step = "menu"; o.err = "You're no longer in that room."; }
    if (S.view === "online") render();
    return;
  }
  // the host left: the next player in line takes over
  const ps = rPlayers();
  if (!ROOM.players[ROOM.host] && ps[0].dev === DEVICE) roomRef("host").set(DEVICE);
  // someone trolled me
  const by = ROOM.scares && ROOM.scares[DEVICE];
  if (by){ roomRef("scares/" + DEVICE).remove(); jumpscare(by, () => { if (S.view === "online") render(); }); }
  applyOnlineRewards();
  if (isHost()) hostAutomation();
  if (S.view === "online") render();
}

/* each device rewards its own account, once per round */
function applyOnlineRewards(){
  const o = O(), r = ROOM.round;
  if (!r || !r.players || !r.players.includes(DEVICE) || lastRewarded() === String(r.id)) return;
  const a = o.acct && DATA.accounts[o.acct];
  if (ROOM.game === "lizard" && r.outcome){
    markRewarded(r.id);
    if (!a) return;
    const isLiz = r.liz.includes(DEVICE);
    const p = r.outcome === "team" ? (isLiz?0:1) : r.outcome === "steal" ? (isLiz?1:0) : (isLiz?3:0);
    stat(a, "games"); if (isLiz && r.outcome !== "team" && r.outcome !== "steal") stat(a, "escapes"); if (!isLiz && r.outcome === "team") stat(a, "catches");
    if (p > 0){ a.wins.lizard++; addDaily("lizard", a.id, p); }
    o.notes = [`${a.name}: +${p>0?25:10} XP`, ...reward(a.id, {xp: p>0 ? 25 : 10})]; o.notesRound = r.id;
  }
  if (ROOM.game === "dash" && r.gained){
    markRewarded(r.id);
    if (!a) return;
    const p = r.gained[DEVICE] || 0;
    stat(a, "games"); if (r.drawer === DEVICE && p) stat(a, "drawn"); if (r.first === DEVICE) stat(a, "firsts");
    o.notes = [`${a.name}: +${10+p*2} XP`, ...reward(a.id, {xp: 10 + p*2})]; o.notesRound = r.id;
    if (p) addDaily("dash", a.id, p);
    if (r.champ === DEVICE){ a.wins.dash = (a.wins.dash||0) + 1; o.notes.push(`Doodle Dash champion! +50 XP, +${GB.champ} Gbucks`, ...reward(a.id, {xp:50, gb:GB.champ})); }
  }
  if (ROOM.game === "tsunami" && r.gained){
    markRewarded(r.id);
    if (!a) return;
    const p = r.gained[DEVICE] || 0;
    stat(a, "games"); if (p >= 4) stat(a, "splash");
    o.notes = [`${a.name}: +${10+p*2} XP`, ...reward(a.id, {xp: 10 + p*2})]; o.notesRound = r.id;
    if (p) addDaily("tsunami", a.id, p);
    if (r.champ === DEVICE){ a.wins.tsunami++; o.notes.push(`Tsunami champion! +50 XP, +${GB.champ} Gbucks`, ...reward(a.id, {xp:50, gb:GB.champ})); }
  }
}

/* host-only game logic */
function hostAutomation(){
  const r = ROOM.round, o = O();
  if (ROOM.game === "dash") return dashAutomation();
  if (!r || ROOM.game !== "tsunami" || r.phase !== "guess") return;
  const guessers = r.players.filter(d => d !== r.giver && ROOM.players[d]); // skip anyone who left
  const pins = ROOM.pins || {};
  if (guessers.length && guessers.every(d => pins[d] !== undefined) && o.scored !== r.id){ o.scored = r.id; tsuScoreOnline(guessers, pins); }
}
function lizStartOnline(){
  const ps = rPlayers().map(p => p.dev), st = ROOM.settings || {};
  if (ps.length < 3) return;
  const cat = !st.cat || st.cat === "Random" ? pick(Object.keys(CATS)) : st.cat;
  let count = st.lizards || 1;
  if (count === "R"){ const roll = Math.random(); count = roll < .1 ? 3 : roll < .3 ? 2 : 1; }
  const liz = shuffle(ps).slice(0, Math.min(+count, ps.length));
  const start = Math.floor(Math.random()*ps.length);
  roomRef().update({round:{id:Date.now(), cat, word:pick(CATS[cat]), liz, order:ps.map((_,k) => ps[(start+k)%ps.length]), players:ps,
    phase:"roles", memeA:pick(LIZ_MEMES), memeB:pick(LIZ_END)}, ready:null, scares:null});
}
function lizOutcomeOnline(outcome){
  const r = ROOM.round, sc = Object.assign({}, ROOM.scores || {});
  r.players.forEach(d => { const isLiz = r.liz.includes(d);
    sc[d] = (sc[d]||0) + (outcome === "team" ? (isLiz?0:1) : outcome === "steal" ? (isLiz?1:0) : (isLiz?3:0)); });
  roomRef().update({"round/outcome":outcome, scores:sc});
}
function tsuStartOnline(resetScores){
  const ps = rPlayers().map(p => p.dev), st = ROOM.settings || {};
  if (ps.length < 2) return;
  const prev = ROOM.round && ROOM.round.giver;
  const giver = ps[prev && ps.includes(prev) ? (ps.indexOf(prev)+1) % ps.length : 0];
  const chance = {off:0, rare:1/6, chaos:1/2}[st.rare || "rare"];
  const mode = Math.random() < chance ? pick(MODES) : null;
  const pool = (st.packs && st.packs.length ? st.packs : Object.keys(TPACKS)).flatMap(p => TPACKS[p] || []);
  const scale = mode && mode.id === "whirlpool" ? [pick(pool)[0], pick(pool)[1]] : pick(pool);
  const upd = {round:{id:Date.now(), n:((ROOM.round && ROOM.round.n) || 0) + 1, scale, target:rint(3,97), mode:mode ? mode.id : null, giver, players:ps, phase:"clue"}, pins:null, scares:null};
  if (resetScores){ upd.scores = null; upd.round.n = 1; }
  roomRef().update(clean(upd));
}
function tsuScoreOnline(guessers, pins){
  const r = ROOM.round, st = ROOM.settings || {}, m = MODES.find(x => x.id === r.mode) || null;
  const k = (m && m.band) || 1, mult = (m && m.mult) || 1, scoring = st.scoring || "wta";
  const sc = Object.assign({}, ROOM.scores || {});
  const add = (d, v) => { sc[d] = Math.max(0, (sc[d]||0) + v); };
  const leaderBefore = r.players.slice().sort((a,b) => (sc[b]||0) - (sc[a]||0))[0];
  const gained = {_:0};
  const res = guessers.map(d => ({d, pin:pins[d], dist:Math.abs(pins[d] - r.target)})).map(x => ({...x, p:tpts(x.dist, k) * mult}));
  const best = Math.min(...res.map(x => x.dist)), allMiss = res.every(x => x.p === 0);
  const lines = [], winners = [];
  res.forEach(x => {
    const scores = scoring === "wta" ? (x.dist === best && x.p > 0) : x.p > 0;
    if (scores){ add(x.d, x.p); gained[x.d] = (gained[x.d]||0) + x.p; winners.push(x.d); lines.push([rName(x.d), `+${x.p}${scoring==="wta" ? " (closest)" : ""}`, "plus"]); }
    else lines.push([rName(x.d), x.p ? `${x.dist} away, beaten` : "wiped out 🌊", "-"]);
  });
  const g = r.giver;
  if (allMiss){ add(g, -1); lines.push([rName(g) + " (clue-giver)", "−1, nobody landed it", "minus"]); }
  else if (scoring === "all"){ const avg = Math.round(res.reduce((s,x) => s + x.p, 0) / res.length); add(g, avg); gained[g] = (gained[g]||0) + avg; lines.push([rName(g) + " (clue-giver)", "+" + avg, "plus"]); }
  else lines.push([rName(g) + " (clue-giver)", "safe", "-"]);
  if (m && m.id === "shark" && winners.length){
    const thief = winners[0];
    if (leaderBefore !== thief && (sc[leaderBefore]||0) > 0){
      const take = Math.min(2, sc[leaderBefore]);
      add(leaderBefore, -take); add(thief, take); gained[thief] = (gained[thief]||0) + take;
      lines.push(["🦈 Shark Bite", `${rName(thief)} steals ${take} from ${rName(leaderBefore)}`, "minus"]);
    }
  }
  const top = r.players.filter(d => (sc[d]||0) >= (st.win || 15)).sort((a,b) => sc[b] - sc[a]);
  roomRef().update(clean({"round/phase":"reveal", "round/res":res.map(x => ({d:x.d, pin:x.pin})), "round/lines":lines, "round/gained":gained,
    "round/allMiss":allMiss, "round/champ":top.length ? top[0] : null, scores:sc}));
}

/* ================= DOODLE DASH: one player draws, everyone else guesses ================= */
const DASH_WORDS = {
  "Animals":["Cat","Dog","Fish","Snake","Lizard","Elephant","Giraffe","Penguin","Shark","Octopus","Spider","Turtle","Bunny","Frog","Owl","Crab","Snail","Bat","Monkey","Pig","Dinosaur","Bee","Unicorn","Jellyfish"],
  "Food":["Pizza","Banana","Taco","Donut","Ice Cream","Burger","Hot Dog","Popcorn","Cake","Watermelon","Cookie","Apple","Cheese","Egg","Carrot","Pancakes","Spaghetti","Sushi","Lollipop","Fries","Pineapple","Cupcake"],
  "Things":["Phone","Umbrella","Glasses","Scissors","Ladder","Key","Clock","Lamp","Guitar","Backpack","Toothbrush","Balloon","Rocket","Robot","Crown","Sword","Candle","Trophy","Headphones","Controller","Skateboard","Kite","Light Bulb","Camera","Magnet","Bicycle"],
  "Places":["Beach","Volcano","Castle","School","House","Island","Bridge","Moon","Desert","Igloo","Lighthouse","Waterfall","Pyramid","Rainbow","Tornado","Snowman","Treehouse","Campfire"],
  "Actions":["Sleeping","Swimming","Dancing","Sneezing","Fishing","Juggling","Crying","Running","Climbing","Flying","Painting","Bowling","Surfing","Yawning"],
  "Classic Roger":["Rooster","Locked Door","Shopping Cart","Snoring","Salad","Shelf","Robot","Monkey","Cookie","Alarm Clock","Checklist"],
  "Memes":["Skibidi Toilet","Grimace Shake","Among Us","Trollface","Doge","Nyan Cat","Stonks","Banana Cat","Rickroll","Sigma"]
};
const DASH_COLORS = [["Black","#1b1b1f"],["Red","#e5484d"],["Orange","#f76b15"],["Yellow","#ffc53d"],["Green","#30a46c"],["Blue","#0090ff"],["Purple","#8e4ec6"],["Brown","#8b5a2b"],["Pink","#ff8fc7"],["Eraser","#ffffff"]];
const DASH_SIZES = [["S",5],["M",12],["L",28]];
const DW = 800, DH = 600; // every drawing uses this size, then gets scaled to the screen
const PEN = {color:"#1b1b1f", size:12, cur:null};
const dashPts = rank => Math.max(2, 5 - rank);           // 1st 5, 2nd 4, 3rd 3, then 2
const dashArtist = n => Math.min(6, n*2);                 // artist gets 2 per correct guesser, up to 6
const ordinal = i => ["1st","2nd","3rd"][i] || (i+1) + "th";
const dashNorm = t => String(t).toLowerCase().replace(/[^a-z0-9]/g, "");
function dashMatch(guess, word){
  const g = dashNorm(guess), w = dashNorm(word);
  return !!g && (g === w || g === w + "s" || g + "s" === w || g === w + "es");
}
function dashClose(guess, word){ // off by one letter
  const a = dashNorm(guess), b = dashNorm(word);
  if (b.length < 4 || Math.abs(a.length - b.length) > 1) return false;
  const d = Array.from({length:a.length+1}, (_,i) => [i]);
  for (let j=1;j<=b.length;j++) d[0][j] = j;
  for (let i=1;i<=a.length;i++) for (let j=1;j<=b.length;j++)
    d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1]===b[j-1]?0:1));
  return d[a.length][b.length] === 1;
}
function dashChoices(cat){
  const pool = !cat || cat === "Random" ? [...new Set(Object.values(DASH_WORDS).flat())] : DASH_WORDS[cat] || DASH_WORDS.Things;
  return shuffle(pool).slice(0, 3);
}
// "_ _ _ _" with a letter or two revealed as time runs out
function dashMask(word, frac, seed){
  const idx = [...word].map((ch,i) => /[a-z0-9]/i.test(ch) ? i : -1).filter(i => i >= 0);
  const show = new Set();
  if (frac >= .5 && idx.length > 2) show.add(idx[seed % idx.length]);
  if (frac >= .75 && idx.length > 4) show.add(idx[(seed*7 + 3) % idx.length]);
  return [...word].map((ch,i) => ch === " " ? "  " : !/[a-z0-9]/i.test(ch) ? ch : show.has(i) ? ch.toUpperCase() : "_").join(" ");
}
function drawStrokes(cv, strokes, live){
  if (!cv) return;
  const c = cv.getContext("2d");
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, DW, DH);
  c.lineCap = "round"; c.lineJoin = "round";
  [...(strokes || []), live].forEach(s => {
    if (!s || !s.p || s.p.length < 2) return;
    c.strokeStyle = s.c; c.lineWidth = s.w; c.beginPath(); c.moveTo(s.p[0], s.p[1]);
    if (s.p.length === 2) c.lineTo(s.p[0] + .1, s.p[1]);
    for (let i=2;i<s.p.length;i+=2) c.lineTo(s.p[i], s.p[i+1]);
    c.stroke();
  });
}
// lets the artist draw on the canvas; onMove gets the stroke so far, onEnd the finished stroke
function bindDrawPad(cv, onEnd, onMove){
  const c = cv.getContext("2d");
  const pt = e => { const r = cv.getBoundingClientRect();
    return [Math.round(Math.max(0, Math.min(DW, (e.clientX - r.left) / r.width * DW))), Math.round(Math.max(0, Math.min(DH, (e.clientY - r.top) / r.height * DH)))]; };
  cv.onpointerdown = e => { e.preventDefault(); try { cv.setPointerCapture(e.pointerId); } catch(_){}
    PEN.cur = {c:PEN.color, w:PEN.size, p:pt(e)};
    c.fillStyle = PEN.color; c.beginPath(); c.arc(PEN.cur.p[0], PEN.cur.p[1], PEN.size/2, 0, Math.PI*2); c.fill();
    if (onMove) onMove(PEN.cur); };
  cv.onpointermove = e => { const s = PEN.cur; if (!s) return;
    const [x,y] = pt(e), n = s.p.length;
    if (Math.abs(x - s.p[n-2]) + Math.abs(y - s.p[n-1]) < 3) return;
    c.strokeStyle = s.c; c.lineWidth = s.w; c.lineCap = "round"; c.beginPath(); c.moveTo(s.p[n-2], s.p[n-1]); c.lineTo(x, y); c.stroke();
    s.p.push(x, y); if (onMove) onMove(s); };
  const end = () => { const s = PEN.cur; if (!s) return; PEN.cur = null; onEnd(s); };
  cv.onpointerup = end; cv.onpointercancel = end;
}

      <div class="dhead"><span><span class="eyebrow">${esc(dn)} is drawing</span><span class="dmask" id="dmask">${esc(dashMask(r.word, dashFrac(r), r.seed))}</span></span>

      <button class="ghost small" id="peek">👁 Hold to peek at your word</button>
      <div class="card"><h3>Who guessed it?</h3><p class="small-print">Everyone shouts guesses. Tap people in the order they get it right.</p>
        <div class="row">${guessers.map(i => { const k = r.got.indexOf(i);
          return `<button class="small ${k<0?"ghost":""}" data-g="${i}" ${k>=0 && k !== r.got.length-1 ? "disabled" : ""}>${k>=0 ? "✓ " + ordinal(k) + " · " : ""}${esc(nm(i))}</button>`; }).join("")}</div></div>
      <button class="big" id="end">End turn</button>`;
    const cv = $("#dcv");
    drawStrokes(cv, r.strokes);
    bindDrawPad(cv, s => r.strokes.push(s));
    bindDashTools(() => { r.strokes.pop(); drawStrokes(cv, r.strokes); }, () => { r.strokes = []; drawStrokes(cv, r.strokes); });
    const pk = $("#peek"), word = r.word;
    const show = e => { e.preventDefault(); pk.textContent = "🤫 " + word; }, hide = () => { pk.textContent = "👁 Hold to peek at your word"; };
    pk.onpointerdown = show; pk.onpointerup = hide; pk.onpointerleave = hide; pk.onpointercancel = hide;
    pk.onkeydown = e => { if (e.key === " " || e.key === "Enter") show(e); }; pk.onkeyup = hide;
    app.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { const i = +b.dataset.g, k = r.got.indexOf(i);
      if (k < 0) r.got.push(i); else if (k === r.got.length-1) r.got.pop(); render(); });
    $("#end").onclick = end;
    timer = setInterval(() => { const left = dashLeft(r); $("#dtime").textContent = left; $("#dmask").textContent = dashMask(r.word, dashFrac(r), r.seed);
      $("#dtime").classList.toggle("low", left <= 10); if (left <= 0) end(); }, 250);
    return;
  }
  if (r.phase === "reveal"){
    if (!r.scored) dashScoreLocal();
    app.innerHTML = `
      <div class="card center"><div class="eyebrow">The word was</div><div class="word">${esc(r.word)}</div></div>
      <canvas id="dcv" class="dcv" width="${DW}" height="${DH}" aria-label="${esc(dn)}'s drawing of ${esc(r.word)}"></canvas>
      <div class="card"><div class="log">${r.lines.map(([who,txt,cls]) => `<div><span>${esc(who)}</span><span class="${cls||""}">${esc(txt)}</span></div>`).join("")}</div></div>
      ${rewardLines(r.notes)}
      ${!r.got.length ? memeHtml(pick(DASH_MEMES), "🎨") : ""}
      ${scoreCard()}
      <button class="big" id="next">${r.champ !== null ? "See the champion" : "Next turn"}</button>
      <button class="ghost" id="lobby">Back to the lobby</button>`;
    drawStrokes($("#dcv"), r.strokes);
    $("#next").onclick = () => { if (r.champ !== null){ r.phase = "champ"; render(); } else { G.turn++; dashNewTurn(); } };
    $("#lobby").onclick = () => go("lobby", {game:"dash"});
    return;
  }
  // champion
  const c = r.champ;
  app.innerHTML = `
    <div class="card center"><div class="eyebrow">Doodle Dash champion</div>${avatarHtml(playerAv(P[c]),"lg")}<div class="who">🎨 ${esc(nm(c))}</div>
      <p>finished with ${G.scores[c]||0} points.</p>${P[c].acct ? `<p class="gb">+50 XP and +${GB.champ} Gbucks for the win</p>` : ""}</div>
    ${rewardLines(r.champNotes||[])}
    ${memeHtml(["Everyone else","looking at their stick figures"], "🖍️")}
    ${scoreCard()}
    <button class="big" id="again">Play again</button>
    <button class="ghost" id="hub">Back to the hub</button>`;
  $("#again").onclick = () => { S.dash = {scores:{}, turn:0}; dashNewTurn(); };
  $("#hub").onclick = () => go("home");
}
function dashScoreLocal(){
  const l = S.lobby.dash, P = l.players, n = P.length, G = S.dash, r = G.r, d = G.drawer, nm = i => playerName(P[i]);
  const gained = {};
  r.lines = [];
  r.got.forEach((i,k) => { const p = dashPts(k); gained[i] = p; r.lines.push([nm(i), `+${p} · got it ${ordinal(k)}`, "plus"]); });
  [...Array(n).keys()].filter(i => i !== d && !r.got.includes(i)).forEach(i => r.lines.push([nm(i), "didn't get it"]));
  const ap = dashArtist(r.got.length);
  if (ap) gained[d] = ap;
  r.lines.push([nm(d) + " (artist)", ap ? "+" + ap : "nobody got it", ap ? "plus" : "minus"]);
  Object.entries(gained).forEach(([i,p]) => G.scores[i] = (G.scores[i]||0) + p);
  for (let i=0;i<n;i++){
    const pl = P[i]; if (!pl.acct || !DATA.accounts[pl.acct]) continue;
    const a = DATA.accounts[pl.acct], p = gained[i] || 0;
    stat(a, "games"); if (i === d && ap) stat(a, "drawn"); if (r.got[0] === i) stat(a, "firsts");
    r.notes.push(`${a.name}: +${10+p*2} XP`, ...reward(pl.acct, {xp: 10 + p*2}));
    if (p) addDaily("dash", pl.acct, p);
  }
  const last = G.turn + 1 >= n * l.rounds;
  r.champ = last ? [...Array(n).keys()].sort((a,b) => (G.scores[b]||0) - (G.scores[a]||0))[0] : null;
  if (r.champ !== null && P[r.champ].acct && DATA.accounts[P[r.champ].acct]){
    const a = DATA.accounts[P[r.champ].acct]; a.wins.dash = (a.wins.dash||0) + 1;
    r.champNotes = reward(a.id, {xp:50, gb:GB.champ});
  }
  r.scored = true;
}

function dashStartOnline(reset){
  const ps = rPlayers().map(p => p.dev), st = ROOM.settings || {};
  if (ps.length < 2) return;
  const prev = !reset && ROOM.round ? ROOM.round : null;
  const drawer = prev ? ps[(ps.indexOf(prev.drawer) + 1) % ps.length] : ps[0];
  const upd = {round:{id:Date.now(), n:prev ? (prev.n||0) + 1 : 1, total:prev && prev.total ? prev.total : ps.length * (st.rounds || 1),
    drawer, players:ps, phase:"pick", choices:dashChoices(st.cat), seed:rint(1, 999)}, strokes:null, live:null, correct:null, chat:null, scares:null};
  if (reset) upd.scores = null;
  roomRef().update(clean(upd));
}
function dashAutomation(){
  const r = ROOM.round, o = O();
  if (!r || r.phase !== "draw" || o.scored === r.id) return;
  const cor = ROOM.correct || {}, guessers = r.players.filter(d => d !== r.drawer && ROOM.players[d]);
  const allGot = guessers.length > 0 && guessers.every(d => cor[d]);
  if (allGot || r.endNow || !ROOM.players[r.drawer] || Date.now() > r.deadline + 500){ o.scored = r.id; dashScoreOnline(); }
}
function dashScoreOnline(){
  const r = ROOM.round, sc = Object.assign({}, ROOM.scores || {}), cor = ROOM.correct || {};
  const order = Object.entries(cor).filter(([d]) => r.players.includes(d) && d !== r.drawer).sort((a,b) => a[1]-b[1]).map(x => x[0]);
  const gained = {_:0}, lines = [];
  order.forEach((d,k) => { const p = dashPts(k); gained[d] = p; sc[d] = (sc[d]||0) + p; lines.push([rName(d), `+${p} · got it ${ordinal(k)}`, "plus"]); });
  r.players.filter(d => d !== r.drawer && !cor[d]).forEach(d => lines.push([rName(d), "didn't get it", "-"]));
  const ap = dashArtist(order.length);
  if (ap){ gained[r.drawer] = ap; sc[r.drawer] = (sc[r.drawer]||0) + ap; }
  lines.push([rName(r.drawer) + " (artist)", ap ? "+" + ap : "nobody got it", ap ? "plus" : "minus"]);
  const champ = r.n >= r.total ? r.players.slice().sort((a,b) => (sc[b]||0) - (sc[a]||0))[0] : null;
  roomRef().update(clean({"round/phase":"reveal", "round/lines":lines, "round/gained":gained, "round/first":order[0] || null, "round/champ":champ, scores:sc, live:null}));
}

}, 400);

function seasonMeta(){ const s = (DATA.settings && DATA.settings.season) || {}; const id = s.id || 1, info = SEASON_INFO[id] || {};
  return {id, name:s.name || info.name || ("Season " + id), emoji:s.emoji || info.emoji || "🎟️", until:s.until || null}; }
// make sure an account's season progress matches the live season; a new season wipes progress but keeps unlocked items
function fixSeason(a){ const id = seasonMeta().id; if (!a.season || a.season.id !== id) a.season = {id, xp:0, prem:false, claimed:[]}; a.season.claimed = a.season.claimed || []; return a.season; }
function seasonTier(a){ const s = a && a.season && a.season.id === seasonMeta().id ? a.season : {xp:0}; return Math.min(SEASON_TIERS, Math.floor((s.xp||0)/SEASON_XP_PER)); }
const seededShuffle = (arr, rnd) => { arr = arr.slice(); for (let i=arr.length-1;i>0;i--){ const j = Math.floor(rnd()*(i+1)); [arr[i],arr[j]] = [arr[j],arr[i]]; } return arr; };
// the reward track is built fresh for each season number, so every season shuffles in different rewards
function seasonTrack(id){
  const rnd = seeded("ggn-season-" + id);
  const pool = SEASON_SETS[id] || SEASON_ITEM_DEFS;
  const byR = r => seededShuffle(pool.filter(x => x[4] === r).map(x => x[0]), rnd);
  const big = byR("legendary"), pickE = byR("epic"), pickR = byR("rare"), pickC = byR("common");
  let bi=0, ei=0, ri=0, ci=0;
  const tiers = [];
  for (let t=1;t<=SEASON_TIERS;t++){
    let free, prem;
    if (t === SEASON_TIERS) free = {gb:200};
    else if (t % 5 === 0) free = {pack:1};
    else if (t % 2 === 0 && ci < pickC.length) free = {item:pickC[ci++]};
    else free = {gb: t % 3 === 0 ? 50 : 25};
    if (t % 10 === 0 && bi < big.length) prem = {item:big[bi++]};
    else if (t % 5 === 0 && ei < pickE.length) prem = {item:pickE[ei++]};
    else if (t % 2 === 0 && ei < pickE.length) prem = {item:pickE[ei++]};
    else if (ri < pickR.length) prem = {item:pickR[ri++]};
    else prem = {gb:75};
    tiers.push({free, prem});
  }
  return tiers;
}
const passLeft = meta => { if (!meta.until) return null; const ms = meta.until - Date.now(); if (ms <= 0) return "ended";
  const d = Math.floor(ms/864e5), h = Math.floor(ms%864e5/36e5); return d ? `${d}d ${h}h` : `${h}h`; };
const passEndsShort = meta => { const l = passLeft(meta); return l ? (l === "ended" ? "season over" : "ends in " + l) : ""; };
const passEndsLong = meta => { const l = passLeft(meta); return l ? (l === "ended" ? "This season has ended — a new one is coming soon." : "Ends in " + l + ".") : "Play any game to climb the tiers and unlock rewards."; };

const specFor = (track, key) => { const t = track[+key.slice(1) - 1]; return t && (key[0] === "p" ? t.prem : t.free); };
function canClaim(a, track, key){ const T = +key.slice(1);
  if (seasonTier(a) < T || a.season.claimed.includes(key)) return false;
  if (key[0] === "p" && !a.season.prem) return false;
  return !!specFor(track, key);
}
function grantReward(a, spec){
  if (!spec) return "";
  if (spec.item){ if (!a.items.includes(spec.item)) a.items.push(spec.item); return ITEMS[spec.item] ? ITEMS[spec.item].name : "an item"; }
  if (spec.gb){ a.gbucks += spec.gb; return spec.gb + " Gbux"; }
  if (spec.pack){ a.packs += spec.pack; return "a pack 🎁"; }
  return "";
}
const countClaimable = (a, track) => { let n = 0; for (let T=1;T<=SEASON_TIERS;T++) for (const p of ["f","p"]) if (canClaim(a, track, p+T)) n++; return n; };
function claimTier(a, track, key){ if (!canClaim(a, track, key)) return; const got = grantReward(a, specFor(track, key)); a.season.claimed.push(key); saveAccount(a); S.toasts = [`Claimed ${got}!`]; render(); }
function claimAll(a, track){
  const got = [];
  for (let T=1;T<=SEASON_TIERS;T++) for (const p of ["f","p"]){ const key = p+T; if (canClaim(a, track, key)){ got.push(grantReward(a, specFor(track, key))); a.season.claimed.push(key); } }
  if (got.length){ saveAccount(a); S.toasts = [`Claimed ${got.length} reward${got.length>1?"s":""}!`]; }
  render();
}
function buyPremium(a){ fixSeason(a); if (a.season.prem || a.gbucks < SEASON_PRICE) return;
  a.gbucks -= SEASON_PRICE; a.season.prem = true; stat(a, "spent", SEASON_PRICE); saveAccount(a);
  S.toasts = ["⭐ Premium unlocked! Claim your rewards below."]; render();
}
function passCell(a, spec, trackName, T){
  if (!spec) return `<div class="pcell" style="--rc:var(--line)"><small>—</small></div>`;
  const unlocked = seasonTier(a) >= T, key = (trackName === "prem" ? "p" : "f") + T;
  const claimed = a.season.claimed.includes(key), needPrem = trackName === "prem" && !a.season.prem;
  let inner = "", rc = "var(--line)";
  if (spec.item){ const i = ITEMS[spec.item]; if (i){ inner = `${swatch(i)}<small>${esc(i.name)}</small>`; rc = (RARITY[i.rarity] || {}).color || "var(--line)"; } else inner = `<small>?</small>`; }
  else if (spec.gb) inner = `<span class="e">💰</span><small>${spec.gb} G</small>`;
  else if (spec.pack) inner = `<span class="e">🎁</span><small>Pack</small>`;
  let tag;
  if (claimed) tag = `<span class="ptag done">✓</span>`;
  else if (!unlocked) tag = `<span class="ptag">🔒</span>`;
  else if (needPrem) tag = `<span class="ptag" title="Needs Premium">⭐</span>`;
  else tag = `<button class="small" data-claim="${key}">Claim</button>`;
  return `<div class="pcell ${claimed?"done":""}" style="--rc:${rc}">${inner}${tag}</div>`;
}
function renderPass(app){
  const ps = S.pass || (S.pass = {id:null});
  const meta = seasonMeta(), a = ps.id && DATA.accounts[ps.id];
  if (!a){
    const accts = Object.values(DATA.accounts);
    app.innerHTML = `
      <div class="spread"><h2>🎟️ Battle Pass</h2><button class="ghost small" id="back">Back</button></div>
      <div class="passhero"><div class="eyebrow">Current season</div><h1>${esc(meta.emoji + " " + meta.name)}</h1><p>${esc(passEndsLong(meta))}</p></div>
      <div class="card"><h3>Whose battle pass?</h3>
        ${accts.length ? `<div class="acct-grid">${accts.map(x => `<button data-acct="${x.id}">${avatarHtml(x.avatar,"md")}<span>${nameHtml(x)}</span><small>Tier ${seasonTier(x)}${x.season && x.season.prem && x.season.id===meta.id ? " ⭐" : ""}</small></button>`).join("")}</div>`
          : `<p class="small-print">Make an account first.</p>`}</div>`;
    $("#back").onclick = () => go("home");
    app.querySelectorAll("[data-acct]").forEach(b => b.onclick = () => { const id = b.dataset.acct;
      if (loggedIn(id)) go("pass", {pass:{id}}); else startQuiz(id, {view:"pass"}); });
    return;
  }
  fixSeason(a);
  const track = seasonTrack(meta.id), tier = seasonTier(a), xpIn = (a.season.xp||0) % SEASON_XP_PER, claimable = countClaimable(a, track);
  const toast = S.toasts.length ? `<div class="toast">${S.toasts.map(esc).join("<br>")}</div>` : ""; S.toasts = [];
  app.innerHTML = `
    <div class="spread"><button class="ghost small" id="back">← Back</button><span class="row">${avatarHtml(a.avatar,"sm")}<b class="gb">${a.gbucks} Gbux</b></span></div>
    ${toast}
    <div class="passhero">
      <div class="spread"><div class="eyebrow">${esc(meta.name)}${a.season.prem ? " · ⭐ PREMIUM" : ""}</div><div class="eyebrow">${esc(passEndsShort(meta))}</div></div>
      <div class="spread" style="align-items:flex-end"><h1>Tier ${tier}</h1><small>${tier >= SEASON_TIERS ? "MAX TIER" : `${xpIn} / ${SEASON_XP_PER} to tier ${tier+1}`}</small></div>
      <div class="pbar"><i style="width:${tier >= SEASON_TIERS ? 100 : (xpIn/SEASON_XP_PER*100).toFixed(1)}%"></i></div>
      <p class="small-print" style="color:#fff;opacity:.9">Earn Season XP by playing any game — every ${SEASON_XP_PER} XP is a new tier.</p>
    </div>
    ${a.season.prem ? "" : `<div class="card center"><h3>⭐ Unlock Premium</h3>
      <p class="small-print">Unlocks the premium reward on every tier: exclusive faces, name colors and effects you can't get anywhere else. You instantly get everything up to your current tier.</p>
      ${a.gbucks >= SEASON_PRICE ? `<button class="big" id="buyprem">Unlock Premium · ${SEASON_PRICE} Gbux</button>` : `<p class="minus">Costs ${SEASON_PRICE} Gbux — you need ${SEASON_PRICE - a.gbucks} more.</p>`}</div>`}
    ${claimable ? `<button class="big" id="claimall">🎁 Claim all (${claimable})</button>` : ""}
    <div class="ptracklabel"><span>Tier</span><span>Free</span><span>⭐ Premium</span></div>
    <div class="ptrack">
      ${track.map((t,i) => { const T = i+1, cur = T === tier+1;
        return `<div class="ptier ${cur?"cur":""}"${cur?' id="curtier"':""}><div class="tnum">${T}<small>TIER</small></div>${passCell(a,t.free,"free",T)}${passCell(a,t.prem,"prem",T)}</div>`; }).join("")}
    </div>`;
  $("#back").onclick = () => S.verified.includes(a.id) ? go("profile", {profile:{id:a.id, tab:"avatar"}}) : go("home");
  const bp = $("#buyprem"); if (bp) bp.onclick = () => buyPremium(a);
  const ca = $("#claimall"); if (ca) ca.onclick = () => claimAll(a, track);
  app.querySelectorAll("[data-claim]").forEach(b => b.onclick = () => claimTier(a, track, b.dataset.claim));
  if (!ps.scrolled){ const ct = $("#curtier"); if (ct) ct.scrollIntoView({block:"center"}); ps.scrolled = true; }
}

/* ================= boot ================= */
window.claude?.hot?.snapshot?.(() => ({S}));
const start = () => { render(); initStore(); };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>
